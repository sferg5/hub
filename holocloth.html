<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Lab</title>
    <style>
      :root {
        --ink: #f4f3f1;
        --muted: rgba(244,243,241,0.62);
        --faint: rgba(244,243,241,0.40);
        --line: rgba(255,255,255,0.14);
        --glass: rgba(18,19,24,0.62);
        --glass-solid: rgba(18,19,24,0.92);
        --accent: #ff5647;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #060608; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { width: 100%; height: 100%; }

      /* the simulation fills the screen */
      #canvas-host { position: fixed; inset: 0; z-index: 0; }
      #canvas-host canvas { display: block; touch-action: none; }

      /* overlay layer sits above the cloth but lets clicks fall through except on controls */
      .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      .ui > * { pointer-events: auto; }

      button { font: inherit; cursor: pointer; }

      /* top bar */
      .topbar { position: absolute; top: 20px; left: 22px; right: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { display: flex; flex-direction: column; line-height: 1.1; }
      .brand .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
      .brand .t { font-size: 17px; font-weight: 600; }
      .pill { pointer-events: auto; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); color: var(--ink);
        padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
      .pill:hover { border-color: rgba(255,255,255,.32); }
      .pill.accent { background: var(--accent); border-color: var(--accent); color: #fff; }

      /* fabric rail (bottom center) */
      .rail { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 8px;
        padding: 8px; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; max-width: 94vw; flex-wrap: wrap; justify-content: center; }
      .rail button { border: 0; background: transparent; color: var(--muted); padding: 9px 15px; border-radius: 999px; font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
      .rail button .dot { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
      .rail button:hover { color: var(--ink); }
      .rail button.sel { background: rgba(255,255,255,.10); color: var(--ink); }

      /* tiny actions (reset / poke) */
      .acts { position: absolute; left: 22px; bottom: 26px; display: flex; gap: 8px; }
      .acts button { border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
      .acts button:hover { border-color: rgba(255,255,255,.32); }

      .hint { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); color: var(--faint); font-size: 12.5px; text-align: center; }

      /* info panel (right) */
      .info { position: absolute; top: 74px; right: 22px; width: 360px; max-width: calc(100vw - 44px); max-height: calc(100vh - 120px);
        overflow: auto; background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
      .info.hidden { display: none; }
      .info .close { position: absolute; top: 14px; right: 14px; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
      .info h2 { margin: 0 0 2px; font-size: 24px; letter-spacing: -0.01em; }
      .info .meaning { color: var(--accent); font-weight: 600; margin: 0 0 12px; font-size: 13.5px; }
      .info .feel { color: var(--ink); font-size: 14px; margin: 0 0 16px; }
      .info h4 { margin: 16px 0 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
      .tags { display: flex; flex-wrap: wrap; gap: 7px; }
      .tag { background: rgba(255,255,255,.09); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; }
      .notfor { color: var(--muted); font-size: 13px; margin-top: 8px; }
      ul.care { margin: 0; padding-left: 16px; color: var(--ink); }
      ul.care li { margin: 5px 0; font-size: 13px; }
      .prod { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink);
        border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 7px 0; }
      .prod:hover { border-color: rgba(255,255,255,.34); }
      .prod .pn { font-weight: 600; font-size: 13px; }
      .prod .pp { color: var(--muted); font-size: 13px; white-space: nowrap; }

      /* finder modal */
      .scrim { position: absolute; inset: 0; background: rgba(4,4,6,.6); backdrop-filter: blur(6px); display: grid; place-items: center; padding: 20px; }
      .modal { width: 520px; max-width: 100%; max-height: calc(100vh - 40px); overflow: auto; background: var(--glass-solid); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
      .modal .close { float: right; border: 0; background: transparent; color: var(--muted); font-size: 20px; }
      .modal h3 { margin: 0 0 4px; font-size: 22px; }
      .modal .sub { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
      .q { padding: 14px 0; border-top: 1px solid var(--line); }
      .q .prompt { font-weight: 600; margin-bottom: 10px; font-size: 14.5px; }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 11px; padding: 9px 13px; text-align: left; font-size: 13px; }
      .opt:hover { border-color: rgba(255,255,255,.34); }
      .opt.sel { border-color: var(--accent); background: rgba(255,86,71,.16); }
      .opt .lab { font-weight: 600; display: block; }
      .opt .hint { color: var(--muted); font-size: 12px; }
      .match { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 16px; }
      .match .rlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--faint); }
      .match h4 { margin: 4px 0 6px; font-size: 22px; letter-spacing: -.01em; }
      .match .why { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; }
    </style>
    <script type="module" crossorigin src="./holocloth.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
