<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FABLAB</title>
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #6e6e6e;
        --faint: #9a9a9a;
        --line: #e4e2de;
        --card: #ffffff;
        --bg: #f5f5f5;
        --accent: #d31334;
        --radius: 12px;
        --shadow: 0 6px 30px rgba(0,0,0,0.09);
        --dock-w: min(440px, calc(100vw - 24px));
        --dock-bg: rgba(255,255,255,0.55);
        /* every bottom-dock control shares this height and max width so the
           collapsed and expanded states are exactly the same size */
        --ctl-h: 38px;
        /* pills may use the full window width — wide screens show every
           option; narrow ones become scrollable carousels */
        --ctl-max: calc(100vw - 52px);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
      #root { width: 100%; height: 100%; }

      #canvas-host { position: fixed; inset: 0; z-index: 0; }
      #canvas-host canvas { display: block; touch-action: none; }

      .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
      .ui > * { pointer-events: auto; }
      button { font: inherit; cursor: pointer; }

      /* top bar */
      .topbar { position: absolute; top: 22px; left: 26px; right: 26px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      /* Adaptive logo: the app samples the rendered brightness behind the
         wordmark and flips it — WHITE over dark/grey fabric, BLACK over
         light fabric (.on-light). No shadow, no card; a soft color
         transition covers the flip. */
      .brand { position: fixed; top: 22px; left: 26px; z-index: 3; display: flex; flex-direction: column;
        line-height: 1.05; pointer-events: none; }
      .brand .k { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #fff; transition: color .45s ease; }
      .brand .t { font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #fff;
        margin-top: 3px; opacity: .95; transition: color .45s ease; pointer-events: auto; cursor: default;
        white-space: nowrap; }
      .brand.on-light .k, .brand.on-light .t { color: #141414; }
      /* FAB[RIC] LAB[ORATORY] — hidden letters slide open from within */
      .brand .t .x { display: inline-block; max-width: 0; opacity: 0; overflow: hidden;
        vertical-align: bottom; white-space: nowrap;
        transition: max-width .5s cubic-bezier(.4,0,.2,1), opacity .3s ease; }
      .brand.lab-open .t .x { max-width: 9em; opacity: 1; transition: max-width .5s cubic-bezier(.2,.7,.3,1), opacity .35s ease .1s; }
      .topbar { justify-content: flex-end; }
      .pill { border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 11px 20px; border-radius: 999px; font-weight: 500; font-size: 14px; letter-spacing: .01em; }
      .pill:hover { background: rgba(0,0,0,.05); }
      .pill.accent { background: var(--ink); border-color: var(--ink); color: #fff; }
      .pill.accent:hover { background: #000; }

      /* THE menu — one bottom-left dock holding every control. The Menu pill
         at the bottom reveals the stack above it; items slide up and fade in
         with a slight stagger (bottom-most first), and reverse on close. */
      /* HIT-TESTING: every container passes pointer events through — ONLY the
         pill shapes themselves are interactive, so the fabric can be grabbed
         right between and around the menu rows. */
      .dock { position: absolute; left: 26px; bottom: 20px; display: flex; flex-direction: column;
        align-items: flex-start; gap: 8px; max-width: var(--ctl-max); pointer-events: none; }
      .dock .menu-toggle { pointer-events: auto; }
      .stack { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 100%; pointer-events: none; }
      .stack > * { opacity: 0; transform: translateY(14px) scale(.97); visibility: hidden; pointer-events: none;
        transition: opacity .26s ease, transform .26s ease, visibility 0s linear .3s; }
      .dock.open .stack > * { opacity: 1; transform: none; visibility: visible; pointer-events: auto;
        transition: opacity .34s cubic-bezier(.2,.7,.3,1), transform .34s cubic-bezier(.2,.7,.3,1); }
      /* the convo wrapper is a container, not a control — pass through; its
         pill and interactive chips re-enable themselves */
      .dock.open .stack > .convo { pointer-events: none; }
      .dock.open .convo .pillmenu { pointer-events: auto; }
      /* OPEN: bottom-most pill first, rippling upward */
      .dock.open .stack > *:nth-last-child(1)  { transition-delay: .02s; }
      .dock.open .stack > *:nth-last-child(2)  { transition-delay: .06s; }
      .dock.open .stack > *:nth-last-child(3)  { transition-delay: .10s; }
      .dock.open .stack > *:nth-last-child(4)  { transition-delay: .14s; }
      .dock.open .stack > *:nth-last-child(5)  { transition-delay: .18s; }
      .dock.open .stack > *:nth-last-child(6)  { transition-delay: .22s; }
      .dock.open .stack > *:nth-last-child(7)  { transition-delay: .26s; }
      .dock.open .stack > *:nth-last-child(8)  { transition-delay: .30s; }
      .dock.open .stack > *:nth-last-child(9)  { transition-delay: .34s; }
      .dock.open .stack > *:nth-last-child(10) { transition-delay: .38s; }
      .dock.open .stack > *:nth-last-child(11) { transition-delay: .42s; }
      .dock.open .stack > *:nth-last-child(12) { transition-delay: .46s; }
      /* CLOSE: quick, tightly-staggered collapse toward the Menu button —
         small enough steps that no pill visibly straggles behind the rest
         (per-property delays: opacity, transform, then visibility AFTER) */
      .stack > *:nth-child(1)  { transition-delay: 0s, 0s, .27s; }
      .stack > *:nth-child(2)  { transition-delay: .02s, .02s, .29s; }
      .stack > *:nth-child(3)  { transition-delay: .04s, .04s, .31s; }
      .stack > *:nth-child(4)  { transition-delay: .06s, .06s, .33s; }
      .stack > *:nth-child(5)  { transition-delay: .08s, .08s, .35s; }
      .stack > *:nth-child(6)  { transition-delay: .10s, .10s, .37s; }
      .stack > *:nth-child(7)  { transition-delay: .12s, .12s, .39s; }
      .stack > *:nth-child(8)  { transition-delay: .14s, .14s, .41s; }
      .stack > *:nth-child(9)  { transition-delay: .16s, .16s, .43s; }
      .stack > *:nth-child(10) { transition-delay: .18s, .18s, .45s; }
      .stack > *:nth-child(11) { transition-delay: .20s, .20s, .47s; }
      .stack > *:nth-child(12) { transition-delay: .22s, .22s, .49s; }
      /* CHAT FOCUS: while the guide conversation is open, every other pill
         fades away so the chat has the stage; they fade back on collapse.
         (declared after the stagger rules so it wins the cascade) */
      /* :nth-child(n) bumps specificity above the open-stagger delay rules */
      .dock.chat-focus .stack > *:nth-child(n):not(.convo) { opacity: 0; transform: translateY(10px) scale(.98);
        visibility: hidden; pointer-events: none;
        transition: opacity .22s ease, transform .22s ease, visibility 0s linear .24s;
        transition-delay: 0s, 0s, .24s; }

      .menu-toggle { cursor: pointer; gap: 10px; }
      .menu-toggle .c-lab { color: var(--ink); }
      .menu-toggle.open .tog { transform: rotate(45deg); }

      /* ============================================================
         ANIMATED PILL SYSTEM — one shell (.pillmenu) whose collapsed
         value and expanded options are BOTH mounted; a CSS grid
         0fr↔1fr tween slides between them so every open/close is a
         smooth horizontal morph. The + toggle rotates 45° into an ×.
         ============================================================ */
      /* shared metrics so every pill lines up: 11px left inset to the icon,
         10px gap between icon/label/content, 16px right inset */
      .pillmenu { display: inline-flex; align-items: center; height: var(--ctl-h); max-width: var(--ctl-max);
        background: var(--dock-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        border: 1px solid rgba(0,0,0,0.07); border-radius: 999px; box-shadow: 0 3px 14px rgba(0,0,0,0.07);
        padding: 0 13px 0 8px; transition: border-color .2s ease, background-color .2s ease; }
      .pillmenu:hover { border-color: rgba(0,0,0,0.25); background: rgba(255,255,255,0.72); }
      .pillmenu .ph { display: inline-flex; align-items: center; gap: 8px; height: 100%; border: 0;
        background: transparent; cursor: pointer; padding: 0; flex: 0 0 auto; }
      .tog { flex: 0 0 auto; width: 21px; height: 21px; border-radius: 50%; border: 1px solid var(--line);
        background: rgba(255,255,255,0.8); color: var(--muted); display: inline-grid; place-items: center;
        font-size: 13px; font-weight: 400; line-height: 1; box-sizing: border-box; padding: 0 0 1px;
        transition: transform .32s cubic-bezier(.4,0,.2,1), border-color .15s, color .15s; }
      /* the toggle keeps its quiet hairline in every state — only the glyph
         rotates (+ → ×) and darkens slightly; no black ring */
      .pillmenu.open .tog { transform: rotate(45deg); color: var(--ink); }
      .pillmenu .ph:hover .tog { color: var(--ink); }
      .c-lab { color: var(--muted); font-size: 9px; letter-spacing: .11em; text-transform: uppercase;
        font-weight: 700; white-space: nowrap; }

      /* the sliding regions */
      .grow { display: grid; min-width: 0; height: 100%;
        transition: grid-template-columns .38s cubic-bezier(.4,0,.2,1); }
      .grow .gin { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; display: flex; align-items: center;
        gap: 6px; min-width: 0; height: 100%; white-space: nowrap;
        transition: opacity .22s ease; }
      .grow .gin::-webkit-scrollbar { display: none; }
      /* sequential swap: whichever region is APPEARING waits until the other
         has fully faded, so the pill reads as one element transforming —
         never two versions of the content overlapping */
      .gval { grid-template-columns: 1fr; }
      .gopts { grid-template-columns: 0fr; }
      .pillmenu.open .gval { grid-template-columns: 0fr; }
      .pillmenu.open .gopts { grid-template-columns: 1fr; }
      .gval .gin { opacity: 1; padding-left: 10px; transition: opacity .14s ease .16s; }
      .pillmenu.open .gval .gin { opacity: 0; padding-left: 0; transition: opacity .14s ease; }
      .gopts .gin { opacity: 0; padding-left: 10px; transition: opacity .14s ease; }
      .pillmenu.open .gopts .gin { opacity: 1; transition: opacity .14s ease .16s; }

      /* persistent slot — shared controls that exist in BOTH states */
      .ptail { flex: 0 0 auto; display: inline-flex; align-items: center; padding-left: 8px; }
      /* right-edge fade ONLY when the row actually overflows (a carousel);
         when the window is wide enough to show everything, no gradient */
      .pillmenu.open .gopts .gin.can-scroll {
        -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
        mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
      }

      /* current-value chip — animates in whenever the selection changes */
      .c-val { font-weight: 600; font-size: 11.5px; white-space: nowrap; color: var(--ink);
        animation: valin .3s cubic-bezier(.2,.7,.3,1); }
      .c-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0,0,0,.16);
        flex: 0 0 auto; animation: valin .3s cubic-bezier(.2,.7,.3,1); }
      @keyframes valin { from { opacity: 0; transform: translateY(6px) scale(.9); } }

      /* option buttons inside an expanded pill — selection animates */
      .gopts .gin > button:not(.sw):not(.rail-action):not(.askbtn) { flex: 0 0 auto; border: 0;
        background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 999px;
        font-weight: 500; font-size: 11.5px; white-space: nowrap; cursor: pointer;
        transition: background-color .25s ease, color .25s ease, transform .15s ease; }
      .gopts .gin > button:not(.sw):not(.rail-action):not(.askbtn):hover { color: var(--ink); background: rgba(0,0,0,0.06); }
      .gopts .gin > button:not(.sw):not(.rail-action):not(.askbtn).sel { background: var(--ink); color: #fff; }
      .gopts .gin > button:not(.sw):active { transform: scale(.95); }

      .sw { flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.14);
        padding: 0; cursor: pointer; transition: box-shadow .22s ease, transform .15s ease; }
      .sw:hover { transform: scale(1.12); }
      .sw.sel { box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--ink); }

      /* chat pill specifics */
      .chatpill .c-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink);
        font-weight: 500; font-size: 11.5px; max-width: min(380px, 60vw); }
      .chatpill.open { width: 100%; }
      .askin { display: flex; align-items: center; gap: 7px; flex: 1; min-width: min(300px, calc(100vw - 150px)); }
      .askin input { flex: 1; border: 0; background: transparent; outline: none; font: inherit; font-size: 12px; color: var(--ink); min-width: 0; }
      .askin input::placeholder { color: var(--faint); }
      .chatpill .gopts.grow { flex: 1; }

      /* actions */
      .acts { position: absolute; right: 26px; top: 74px; display: flex; flex-direction: column; gap: 8px; }

      /* compact labelled slider that fits the fixed pill height */
      .psl { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
      .psl span { font-size: 10px; color: var(--muted); font-weight: 500; white-space: nowrap; }
      .psl input[type=range] { width: 62px; accent-color: var(--ink); margin: 0; height: 12px; }
      .rail-action { flex: 0 0 auto; border: 0; background: var(--ink); color: #fff; border-radius: 999px;
        padding: 6px 12px; font-weight: 600; font-size: 11px; white-space: nowrap; cursor: pointer; }
      .rail-action:hover { background: #000; }
      /* inline metric pair inside an expanded pill */
      .pm { flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 4px; padding: 0 4px; white-space: nowrap;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .pm i { font-style: normal; font-size: 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
      .pm b { font-weight: 600; font-size: 10.5px; color: var(--ink); }
      .panel { background: rgba(255,255,255,0.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
      .panel-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; background: transparent; border: 0; cursor: pointer;
        font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink); }
      .panel-head:hover { color: #000; }
      .chev { color: var(--muted); font-size: 15px; font-weight: 400; }
      .head-right { display: inline-flex; align-items: center; gap: 9px; }
      .head-val { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; text-transform: none; }
      .panel-body { padding: 0 15px 6px; }
      .panel-body .grp { padding: 12px 0; border-top: 1px solid var(--line); }
      .panel-body .grp:first-child { border-top: 0; }
      .grp h6 { margin: 0 0 9px; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .grp-head { width: 100%; display: flex; align-items: center; justify-content: space-between; background: transparent; border: 0; cursor: pointer; padding: 0; }
      .grp-head h6 { margin: 0; }
      .grp-head:hover h6 { color: var(--ink); }
      .srow { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; margin: 7px 0; }
      .srow span { font-size: 12.5px; color: var(--ink); }
      .srow input[type=range] { width: 100%; accent-color: var(--ink); }
      .qslider { width: 100%; accent-color: var(--ink); display: block; }
      /* quality tick marks — one per tier, clickable, lowest on the left */
      .qticks { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 2px; }
      .qtick { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 3px;
        border: 0; background: transparent; padding: 2px 0 0; cursor: pointer; }
      .qtick .qmark { width: 1px; height: 5px; background: var(--line); }
      .qtick .qlab { font-size: 8.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); font-weight: 600; white-space: nowrap; }
      .qtick:first-child { align-items: flex-start; }
      .qtick:last-child { align-items: flex-end; }
      .qtick:hover .qlab { color: var(--muted); }
      .qtick.on .qmark { background: var(--ink); height: 6px; }
      .qtick.on .qlab { color: var(--ink); }
      .seg { display: flex; flex-wrap: wrap; gap: 6px; }
      .seg button { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 500; cursor: pointer; }
      .seg button:hover { border-color: var(--ink); }
      .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
      .menu-action { width: 100%; border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
      .menu-action:hover { background: #000; }
      /* metrics read as a horizontal strip of label/value pairs inside the pill */
      .perf { display: flex; align-items: center; gap: 14px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; padding: 0 6px; }
      .perf .prow { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; white-space: nowrap; }
      .perf .prow span { color: var(--faint); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; }
      .perf .prow b { font-weight: 600; color: var(--ink); }
      .perf .pnote { margin-top: 6px; color: var(--faint); font-size: 10px; }

      /* in-AR DOM overlay (WebXR) — identical pill language to the main UI.
         The frosted pills read cleanly over the camera feed. */
      #ar-overlay { position: fixed; inset: 0; z-index: 20; pointer-events: none;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      #ar-overlay .ar-topbar { position: absolute; top: 22px; left: 26px; right: 26px;
        display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
      #ar-overlay .ar-topbar > * { pointer-events: auto; }
      .ar-chip { gap: 8px; padding: 0 16px; }
      #ar-overlay .ar-hint { position: absolute; top: 76px; left: 0; right: 0; text-align: center;
        color: rgba(255,255,255,0.9); font-size: 12px; text-shadow: 0 1px 6px rgba(0,0,0,.55); pointer-events: none; }
      /* the dock inside AR behaves exactly like the main one: containers pass
         through, only pills are interactive */
      #ar-overlay .dock { pointer-events: none; }
      #ar-overlay .pill.accent { pointer-events: auto; }

      /* mobile-first refinements */
      @media (max-width: 640px) {
        .topbar { top: 14px; left: 16px; right: 16px; }
        .menu { top: 58px; left: 16px; }
        .menu-stack { width: min(244px, calc(100vw - 32px)); }
        .brand .k { font-size: 14px; }
        .pill { padding: 9px 15px; font-size: 13px; }
        :root { --ctl-max: calc(100vw - 32px); --ctl-h: 36px; }
        .dock { left: 16px; bottom: 16px; }
        .chatpill .c-txt { max-width: 48vw; }
        .convo.open { width: var(--ctl-max); }
        .askin { min-width: 0; }
      }
      .acts button { border: 1px solid var(--line); background: var(--card); color: var(--ink); width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; box-shadow: var(--shadow); font-size: 16px; }
      .acts button:hover { border-color: var(--ink); }

      .hint { position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%); color: var(--faint); font-size: 12.5px; text-align: center; }

      .splash-btn { position: absolute; left: 26px; bottom: 30px; border: 1px solid var(--line);
        background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        color: var(--ink); font-weight: 600; font-size: 13.5px; padding: 11px 18px; border-radius: 999px; box-shadow: var(--shadow); cursor: pointer; }
      .splash-btn:hover { border-color: var(--ink); }

      /* info panel */
      .info { position: absolute; top: 78px; right: 26px; width: 366px; max-width: calc(100vw - 52px); max-height: calc(100vh - 128px);
        overflow: auto; background: rgba(255,255,255,0.60); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,0.55); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
      .info.hidden { display: none; }
      .info .close { position: absolute; top: 14px; right: 14px; border: 0; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; }
      .info h2 { margin: 0 0 3px; font-size: 25px; font-weight: 700; letter-spacing: -0.01em; }
      .info .meaning { color: var(--muted); font-weight: 500; margin: 0 0 12px; font-size: 13.5px; }
      .info .feel { color: var(--ink); font-size: 14px; margin: 0 0 16px; line-height: 1.5; }
      .info h4 { margin: 18px 0 9px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
      .swatches { display: flex; flex-wrap: wrap; gap: 9px; }
      .swatch { width: 27px; height: 27px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); padding: 0; cursor: pointer; transition: transform .1s; }
      .swatch:hover { transform: scale(1.08); }
      .swatch.sel { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink); }
      .prints { display: flex; flex-wrap: wrap; gap: 7px; }
      .print { border: 1px solid var(--line); background: rgba(255,255,255,0.5); color: var(--ink); border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 500; }
      .print:hover { border-color: var(--ink); }
      .print.sel { background: var(--ink); color: #fff; border-color: var(--ink); }
      .tags { display: flex; flex-wrap: wrap; gap: 7px; }
      .tag { background: #f2f0ec; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
      .notfor { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.5; }
      ul.care { margin: 0; padding-left: 16px; color: var(--ink); }
      ul.care li { margin: 6px 0; font-size: 13px; line-height: 1.5; }
      .prod { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink);
        border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 8px 0; transition: border-color .12s; }
      .prod:hover { border-color: var(--ink); }
      .prod .pn { font-weight: 500; font-size: 13.5px; }
      .prod .pp { color: var(--ink); font-size: 13.5px; white-space: nowrap; font-weight: 500; }

      /* finder modal */
      .scrim { position: absolute; inset: 0; background: rgba(245,245,245,.72); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; }
      .modal { width: 540px; max-width: 100%; max-height: calc(100vh - 40px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.16); }
      .modal .close { float: right; border: 0; background: transparent; color: var(--muted); font-size: 22px; }
      .modal h3 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
      .modal .sub { color: var(--muted); margin: 0 0 8px; font-size: 14px; }
      .q { padding: 16px 0; border-top: 1px solid var(--line); }
      .q .prompt { font-weight: 600; margin-bottom: 11px; font-size: 15px; }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; }
      .opt { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 11px; padding: 10px 14px; text-align: left; font-size: 13px; }
      .opt:hover { border-color: var(--ink); }
      .opt.sel { border-color: var(--ink); background: var(--ink); color: #fff; }
      .opt .lab { font-weight: 500; display: block; }
      .opt .hint { color: var(--muted); font-size: 12px; }
      .opt.sel .hint { color: rgba(255,255,255,.7); }
      .match { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 18px; }
      .match .rlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--faint); }
      .match h4 { margin: 5px 0 6px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
      .match .why { color: var(--muted); font-size: 13.5px; margin: 0 0 14px; line-height: 1.5; }

      /* conversation — the stream floats above the chat pill when open */
      .convo { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; max-width: 100%; }
      /* the chat column is chat-sized, not screen-sized */
      .convo.open { width: min(520px, var(--ctl-max)); }
      .convo .stream, .convo .chips { pointer-events: none; } /* drags fall through */
      .convo .chip2, .convo .prodcard { pointer-events: auto; }
      .stream { display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 9px; max-height: 40vh; overflow: hidden; pointer-events: none; }
      .msg { max-width: 80%; font-size: 14.5px; line-height: 1.5; padding: 11px 15px; border-radius: 18px; display: flex; flex-direction: column; gap: 9px;
        animation: rise .32s ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .msg.bot { align-self: flex-start; background: rgba(255,255,255,0.85); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
        color: var(--ink); box-shadow: 0 6px 26px rgba(0,0,0,0.12); border-bottom-left-radius: 6px; }
      .msg.user { align-self: flex-end; background: rgba(22,22,22,0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        color: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.16); border-bottom-right-radius: 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip2 { pointer-events: auto; border: 0; background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        color: var(--ink); border-radius: 999px; padding: 9px 15px; font-size: 13px; font-weight: 500; cursor: pointer;
        display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.10); transition: transform .1s; }
      .chip2:hover { transform: translateY(-1px); }
      .chip2 .cdot { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
      .prodcard { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-decoration: none; color: var(--ink);
        border: 1px solid rgba(0,0,0,0.10); border-radius: 12px; padding: 10px 12px; background: #fff; }
      .prodcard:hover { border-color: var(--ink); }
      .prodcard .pn { font-weight: 500; font-size: 13px; }
      .prodcard .pp { font-weight: 600; font-size: 13px; white-space: nowrap; }
      .askbtn { border: 0; background: var(--ink); color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; line-height: 1; cursor: pointer; flex: 0 0 auto; }
      .askbtn:hover { background: #000; }
      .restart { pointer-events: auto; align-self: center; border: 0; background: transparent; color: var(--faint); font-size: 12px; cursor: pointer; }
      .restart:hover { color: var(--muted); }
      .convo-actions { align-self: center; display: flex; align-items: center; gap: 8px; }
      .linkbtn { pointer-events: auto; border: 0; background: transparent; color: var(--faint); font-size: 12px; cursor: pointer; }
      .linkbtn:hover { color: var(--muted); }
      .dotsep { color: var(--faint); font-size: 12px; }
      .chat-launch { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%); border: 0;
        background: rgba(255,255,255,0.9); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink);
        font-weight: 600; font-size: 14px; padding: 12px 22px; border-radius: 999px; box-shadow: 0 6px 26px rgba(0,0,0,0.12); cursor: pointer; }
      .chat-launch:hover { transform: translateX(-50%) translateY(-1px); }
    </style>
    <script type="module" crossorigin src="./holocloth.js"></script>
  </head>
