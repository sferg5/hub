<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabric Finder</title>
    <style>
      :root {
        --bg: #faf9f7;
        --card: #ffffff;
        --ink: #17181b;
        --muted: #6b6f76;
        --line: #e7e4df;
        --accent: #d1202f;
        --accent-soft: #fbe9ea;
        --panel: #0c0d12;
        --radius: 16px;
        --maxw: 1080px;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      #root { width: 100%; }
      a { color: inherit; }

      .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

      /* hero */
      .hero { padding: 72px 0 40px; }
      .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; font-weight: 700; color: var(--accent); }
      .hero h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.05; margin: 12px 0 14px; letter-spacing: -0.02em; }
      .hero p { font-size: clamp(16px, 2vw, 20px); color: var(--muted); max-width: 640px; margin: 0; }
      .hero .cta { margin-top: 26px; display: inline-flex; gap: 12px; flex-wrap: wrap; }

      .btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600;
        padding: 12px 20px; border-radius: 999px; background: var(--ink); color: #fff; transition: transform .08s ease, opacity .15s; }
      .btn:hover { opacity: .9; }
      .btn:active { transform: translateY(1px); }
      .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
      .btn.accent { background: var(--accent); }

      section { padding: 40px 0; }
      .section-head { margin-bottom: 22px; }
      .section-head h2 { font-size: clamp(24px, 3.4vw, 34px); margin: 0 0 6px; letter-spacing: -0.01em; }
      .section-head p { margin: 0; color: var(--muted); }

      /* finder */
      .finder-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
      .q { padding: 16px 0; border-top: 1px solid var(--line); }
      .q:first-child { border-top: 0; padding-top: 0; }
      .q .prompt { font-weight: 650; margin-bottom: 12px; }
      .opts { display: flex; flex-wrap: wrap; gap: 10px; }
      .chip { appearance: none; cursor: pointer; font: inherit; background: #fff; border: 1px solid var(--line);
        border-radius: 12px; padding: 10px 14px; text-align: left; transition: border-color .12s, background .12s; }
      .chip:hover { border-color: #cfcbc4; }
      .chip.sel { border-color: var(--accent); background: var(--accent-soft); }
      .chip .lab { font-weight: 600; display: block; }
      .chip .hint { color: var(--muted); font-size: 12.5px; }

      .result { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 20px; display: none; }
      .result.show { display: block; }
      .result .rlabel { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
      .result h3 { margin: 4px 0 6px; font-size: 26px; }
      .result .why { color: var(--muted); margin: 0 0 14px; }
      .runner { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 13.5px; color: var(--muted); }
      .runner b { color: var(--ink); font-weight: 600; }

      /* library grid */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
      .fab-card { text-align: left; cursor: pointer; background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 18px; transition: border-color .12s, transform .08s; }
      .fab-card:hover { border-color: #cfcbc4; transform: translateY(-2px); }
      .fab-card.sel { border-color: var(--accent); }
      .swatch { width: 100%; height: 74px; border-radius: 10px; margin-bottom: 12px; }
      .fab-card h3 { margin: 0 0 4px; font-size: 19px; }
      .fab-card .one { color: var(--muted); font-size: 13.5px; margin: 0; }

      /* detail */
      .detail-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 24px; align-items: start; }
      @media (max-width: 820px) { .detail-grid { grid-template-columns: 1fr; } }
      .canvas-card { background: var(--panel); border-radius: var(--radius); overflow: hidden; position: relative; min-height: 380px; }
      #canvas-host { position: absolute; inset: 0; }
      #canvas-host canvas { display: block; touch-action: none; width: 100%; height: 100%; }
      .canvas-hint { position: absolute; left: 14px; bottom: 12px; color: rgba(255,255,255,.7);
        font-size: 12.5px; background: rgba(0,0,0,.35); padding: 5px 10px; border-radius: 8px; backdrop-filter: blur(4px); }
      .fab-switch { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 70%; }
      .fab-switch button { cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; color: #fff;
        background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 5px 10px; }
      .fab-switch button.sel { background: #fff; color: #111; border-color: #fff; }

      .detail-info h2 { font-size: 30px; margin: 0 0 2px; letter-spacing: -0.01em; }
      .detail-info .meaning { color: var(--accent); font-weight: 600; margin: 0 0 14px; }
      .detail-info .feel { margin: 0 0 18px; }
      .block { margin: 18px 0; }
      .block h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
      .tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .tag { background: #f1efec; border-radius: 999px; padding: 5px 11px; font-size: 13px; }
      .notfor { color: var(--muted); font-size: 14px; margin-top: 8px; }
      ul.care { margin: 0; padding-left: 18px; }
      ul.care li { margin: 5px 0; }
      .prod { display: flex; align-items: center; justify-content: space-between; gap: 12px;
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 8px 0; text-decoration: none; }
      .prod:hover { border-color: #cfcbc4; }
      .prod .pn { font-weight: 600; }
      .prod .pp { color: var(--muted); white-space: nowrap; }
      .prod .go { color: var(--accent); font-weight: 600; font-size: 13px; white-space: nowrap; }

      footer { padding: 40px 0 60px; color: var(--muted); font-size: 13px; }
      footer a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
