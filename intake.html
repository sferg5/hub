<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Motion Intake · Motion Specialist Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><circle cx='50' cy='50' r='24' fill='none' stroke='%2322c55e' stroke-width='8'/></svg>" />
<style>
  :root{
    --bg:#09090b; --panel:#18181b; --surface:#0d0d0f; --line:#27272a; --line2:#3f3f46;
    --text:#f4f4f5; --muted:#a1a1aa; --faint:#8a8a92; --accent:#22c55e;
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 72px}
  .wrap{max-width:1400px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:40;background:var(--bg);margin-bottom:24px}
  .hbar{max-width:1400px;margin:0 auto;padding:20px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .hleft{display:flex;flex-direction:column;gap:8px;min-width:0}
  .titlerow{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
  .sub{font-size:13px;color:var(--faint);margin:0}
  .brand{height:26px;width:26px;flex-shrink:0;display:block}

  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px;line-height:1.5;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:#d4d4d8;transition:border-color .14s ease,color .14s ease}
  .btn:hover{border-color:var(--line2);color:var(--text)}
  .btn.primary{background:var(--accent);color:#052e16;border-color:var(--accent);font-weight:500;padding:8px 16px}
  .btn.primary:hover{background:#4ade80;border-color:#4ade80}

  .navwrap{position:relative;flex-shrink:0}
  .hamb{display:flex;align-items:center;justify-content:center;padding:8px;border-radius:10px;cursor:pointer;background:var(--panel);border:1px solid var(--line);color:var(--muted);transition:border-color .14s ease,color .14s ease}
  .hamb:hover{border-color:var(--line2);color:var(--text)}
  .navmenu{position:absolute;left:0;top:calc(100% + 8px);width:240px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden;z-index:60}
  .navmenu[hidden]{display:none}
  .navitem{display:flex;align-items:center;gap:12px;padding:12px 12px;text-decoration:none;color:var(--text);transition:background .14s;font-size:13.5px}
  .navitem:hover{background:var(--surface)}
  .navitem .ni-txt{min-width:0;flex:1;display:flex;flex-direction:column}
  .navitem .ni-lbl{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navitem .ni-desc{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navitem .ni-ext{color:var(--faint);flex-shrink:0}

  .hero{margin-top:24px;padding:32px 32px;background:linear-gradient(155deg, rgba(34,197,94,.10), transparent 55%), var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;gap:24px}
  .hero-top{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .avatar{width:108px;height:108px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;border:2px solid rgba(34,197,94,.55);box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;display:block}
  .avatar .fallback{position:absolute;inset:0;display:grid;place-items:center;background:rgba(34,197,94,.14);color:var(--accent);font-weight:700;font-size:40px;letter-spacing:-.02em}
  .hero-text{min-width:0;flex:1}
  .hero h2{margin:0 0 12px;font-size:28px;font-weight:700;letter-spacing:-.02em}
  .hero .lead{color:var(--muted);font-size:15px;line-height:1.65;max-width:64ch;margin:0}
  .hero .btnrow{margin-top:0}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;grid-auto-rows:1fr;margin-top:28px}
  @media (max-width:820px){.cards{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}
  .card .ic{width:38px;height:38px;border-radius:10px;background:rgba(34,197,94,.15);display:grid;place-items:center;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:15px;font-weight:600}
  .card p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55}
  .card .btn{margin-top:auto;align-self:flex-start}

  .closing{margin-top:28px;color:var(--faint);font-size:13px;line-height:1.6}

  /* motion */
  @media (prefers-reduced-motion: no-preference){
    .btn,.hamb{transition:transform .12s ease,background-color .14s ease,border-color .14s ease,color .14s ease,box-shadow .14s ease}
    .btn:active,.hamb:active{transform:translateY(1px)}
    .navmenu:not([hidden]){animation:navPop .16s cubic-bezier(.2,.7,.2,1);transform-origin:top left}
    @keyframes navPop{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
    .navitem .ni-ext{transition:transform .16s ease}
    .navitem:hover .ni-ext{transform:translate(2px,-2px)}
    .card{transition:transform .18s ease,border-color .18s ease}
    .card:hover{transform:translateY(-2px);border-color:var(--line2)}
  }

  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* help + search */
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search-overlay{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px}
  .search-overlay[hidden]{display:none}
  .search-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(2px)}
  .search-panel{position:relative;width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55);padding:24px;max-height:84vh;overflow:auto}
  .search-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center}
  .search-close:hover{color:var(--text);border-color:var(--line2)}
  .search-greeting{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px;padding-right:36px}
  .search-sub{color:var(--faint);font-size:13px;margin:0 0 16px}
  .search-composer{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 16px;transition:border-color .14s}
  .search-composer:focus-within{border-color:var(--accent)}
  .search-composer .hs-ico{color:var(--faint);flex-shrink:0}
  .search-composer input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--text);font-size:15px;font-family:var(--font);padding:8px 0;line-height:1.5}
  .search-composer input::placeholder{color:var(--faint)}
  .search-filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .hs-chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-family:var(--font);transition:border-color .14s,color .14s,background .14s}
  .hs-chip:hover{color:var(--text);border-color:var(--line2)}
  .hs-chip.active{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:var(--accent)}
  .search-suggest{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
  .search-suggest .hs-label{color:var(--faint);font-size:12.5px;margin-right:2px}
  .hs-pill{border:1px solid var(--line);background:var(--panel);color:#d4d4d8;border-radius:999px;padding:8px 12px;font-size:12.5px;cursor:pointer;font-family:var(--font)}
  .hs-pill:hover{border-color:var(--line2);color:var(--text)}
  .search-results{margin-top:20px;display:flex;flex-direction:column;gap:12px}
  .search-lead{color:var(--muted);font-size:13.5px;margin:2px 0 2px}
  .hs-result{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px}
  .hs-result:hover{border-color:var(--line2)}
  .hs-result-cat{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .hs-result-title{display:block;color:var(--text);font-size:14.5px;font-weight:600;margin-bottom:4px}
  .hs-result-snip{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
  .hs-result-go{display:inline-block;margin-top:8px;color:var(--accent);font-size:12.5px;font-weight:600}
  .search-empty{color:var(--muted);font-size:13.5px;margin:2px 0}
  @media (prefers-reduced-motion: no-preference){ .hs-result{transition:border-color .16s ease,transform .16s ease} .hs-result:hover{transform:translateY(-1px)} }
  .hub-help{margin-top:36px;padding:28px;background:linear-gradient(155deg, rgba(34,197,94,.06), transparent 55%), var(--surface);border:1px solid var(--line);border-radius:18px}
  .hub-help-title{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .hub-help-sub{margin:0 0 16px;color:var(--faint);font-size:13.5px}

  /* conversational intake */
  .intake{max-width:760px;margin:24px auto 0;min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center}
  .thread{display:flex;flex-direction:column;gap:16px}
  .msg{display:flex}
  .msg.bot{justify-content:flex-start}
  .msg.you{justify-content:flex-end}
  .bubble{max-width:88%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.55}
  .msg.bot .bubble{background:var(--surface);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:4px}
  .msg.you .bubble{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.4);color:var(--text);border-bottom-right-radius:4px;white-space:pre-wrap}
  .compose{margin-top:20px}
  .opt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:560px){.opt-grid{grid-template-columns:1fr}}
  .opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--text);font-family:var(--font)}
  .opt:hover{border-color:var(--accent)}
  .opt .w{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);float:right}
  .opt .t{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
  .opt .d{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
  .chips2{display:flex;flex-wrap:wrap;gap:8px}
  .chip2{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--font);transition:border-color .14s,color .14s,background .14s}
  .chip2:hover{border-color:var(--line2);color:var(--text)}
  .chip2.sel{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:var(--accent)}
  .field{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--text);font-size:14.5px;font-family:var(--font);outline:none;line-height:1.5}
  .field:focus{border-color:var(--accent)}
  textarea.field{min-height:88px;resize:vertical}
  input[type="date"].field::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
  .compose-actions{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
  .linkbtn{background:none;border:0;color:var(--faint);font-size:13px;cursor:pointer;font-family:var(--font);padding:4px 0}
  .linkbtn:hover{color:var(--text)}
  .review{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 16px;margin-top:4px}
  .rev-row{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
  .rev-row:last-child{border-bottom:0}
  .rev-k{flex:0 0 112px;color:var(--faint);font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
  .rev-v{flex:1;color:var(--text);font-size:14px;line-height:1.5;white-space:pre-wrap}
  .sendnote{color:var(--faint);font-size:13px;margin-top:12px}

  @keyframes bubbleIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .msg.in{animation:bubbleIn .32s cubic-bezier(.2,.7,.2,1)}
  .msg.in .bubble{transform-origin:bottom}
  .bubble.thinking{display:inline-flex;gap:4px;align-items:center;padding:16px}
  .bubble.thinking span{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:think 1.2s infinite ease-in-out}
  .bubble.thinking span:nth-child(2){animation-delay:.18s}
  .bubble.thinking span:nth-child(3){animation-delay:.36s}
  @keyframes think{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .msg.in{animation:none} .bubble.thinking span{animation:none;opacity:.5} }
</style>
</head>

    var st=STEPS[state.i], c="";
    if(st.kind==="cards"){
      c='<div class="opt-grid">'+st.options.map(function(o,ix){return '<button type="button" class="opt" data-ix="'+ix+'"><span class="w">'+esc(o.w)+'</span><span class="t">'+esc(o.v)+'</span><span class="d">'+esc(o.d)+'</span></button>';}).join("")+'</div>';
      if(state.i>0) c+='<div class="compose-actions"><button class="linkbtn" id="backBtn">Back</button></div>';
      compose.innerHTML=c;
      Array.prototype.forEach.call(compose.querySelectorAll(".opt"),function(b){b.onclick=function(){advance(st.options[+b.getAttribute("data-ix")].v);};});
      var bkc=document.getElementById("backBtn"); if(bkc) bkc.onclick=back;
    } else if(st.kind==="chips"){
      c='<div class="chips2">'+st.options.map(function(o){return '<button type="button" class="chip2" data-v="'+esc(o)+'">'+esc(o)+'</button>';}).join("")+'</div>';
      c+='<div class="compose-actions">'+(st.multi?'<button class="btn primary" id="contBtn">Continue</button>':'')+(state.i>0?'<button class="linkbtn" id="backBtn">Back</button>':'')+'</div>';
      compose.innerHTML=c;
      Array.prototype.forEach.call(compose.querySelectorAll(".chip2"),function(b){b.onclick=function(){
        if(st.multi){b.classList.toggle("sel");var v=b.getAttribute("data-v");var ix=state.multiSel.indexOf(v);if(ix>=0)state.multiSel.splice(ix,1);else state.multiSel.push(v);}
        else advance(b.getAttribute("data-v"));
      };});
      var ct=document.getElementById("contBtn"); if(ct) ct.onclick=function(){advance(state.multiSel.slice());};
      var bk=document.getElementById("backBtn"); if(bk) bk.onclick=back;
    } else if(st.kind==="text"||st.kind==="textarea"){
      c=(st.kind==="textarea"?'<textarea class="field" id="fld" placeholder="'+esc(st.placeholder||"")+'"></textarea>':'<input class="field" id="fld" type="text" placeholder="'+esc(st.placeholder||"")+'" />');
      c+='<div class="compose-actions"><button class="btn primary" id="contBtn">Continue</button>'+(st.optional?'<button class="linkbtn" id="skipBtn">Skip</button>':'')+(state.i>0?'<button class="linkbtn" id="backBtn">Back</button>':'')+'</div>';
      compose.innerHTML=c;
      var fld=document.getElementById("fld"); if(fld) fld.focus();
      var submit=function(){var v=(fld.value||"").trim(); if(!v&&!st.optional){fld.focus();return;} advance(v);};
      document.getElementById("contBtn").onclick=submit;
      if(st.kind==="text"&&fld) fld.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit();}});
      var sk=document.getElementById("skipBtn"); if(sk) sk.onclick=function(){advance("");};
      var bk2=document.getElementById("backBtn"); if(bk2) bk2.onclick=back;
    } else if(st.kind==="monthday"){
      c='<input class="field" id="fld" type="text" placeholder="'+esc(st.placeholder||"e.g. March 14")+'" /><div class="compose-actions"><button class="btn primary" id="contBtn">Continue</button><button class="linkbtn" id="skipBtn">No fixed date</button>'+(state.i>0?'<button class="linkbtn" id="backBtn">Back</button>':'')+'</div>';
      compose.innerHTML=c;
      var fldd=document.getElementById("fld"); if(fldd) fldd.focus();
      var subd=function(){var raw=(fldd.value||"").trim(); if(!raw){advance("");return;} var d=new Date(raw+" "+(new Date().getFullYear())); if(!isNaN(d.getTime())) advance(d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})); else advance(raw);};
      document.getElementById("contBtn").onclick=subd;
      fldd.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();subd();}});
      document.getElementById("skipBtn").onclick=function(){advance("");};
      var bkd=document.getElementById("backBtn"); if(bkd) bkd.onclick=back;
    }
    scrollDown();
  }

  function advance(v){
    var cur=STEPS[state.i];
    state.ans[cur.key]=v;
    youSay(answerText(cur,v));
    if(cur.key==="type"){ STEPS=buildPath(v); state.ans={name:state.ans.name,team:state.ans.team,type:v}; var kp={};[0,1,2].forEach(function(ix){if(state.prompts[ix]!=null)kp[ix]=state.prompts[ix];}); state.prompts=kp; }
    state.i++; state.multiSel=[]; compose.innerHTML="";
    if(state.i>=STEPS.length) botSay(esc(ack()+" That\u2019s everything \u2014 here\u2019s your request, take a quick look:"), showReview);
    else botSay(esc(promptFor(state.i)), ask);
  }
  function back(){ if(state.i<=0)return; state.i--; state.multiSel=[]; rebuild(); }
  function rebuild(){
    thread.innerHTML="";
    appendBubble("bot",esc(state.greeting),false);
    for(var k=0;k<state.i;k++){ appendBubble("bot",esc(promptFor(k)),false); appendBubble("you",answerText(STEPS[k],state.ans[STEPS[k].key]),false); }
    appendBubble("bot",esc(promptFor(state.i)),false);
    ask();
  }

  function reviewRows(){return STEPS.map(function(st){return '<div class="rev-row"><span class="rev-k">'+esc(st.label||st.key)+'</span><span class="rev-v">'+answerText(st,state.ans[st.key])+'</span></div>';}).join("");}
  function showReview(){
    compose.innerHTML='<div class="review">'+reviewRows()+'</div><div class="compose-actions"><button class="btn primary" id="sendBtn">Send request</button><button class="linkbtn" id="editBtn">Start over</button></div><div class="sendnote" id="sendNote"></div>';
    document.getElementById("editBtn").onclick=start;
    document.getElementById("sendBtn").onclick=doSend;
    scrollDown();
  }

  async function getSnapshot(){var r=await fetch(SYNC_URL,{method:"GET",cache:"no-store"});if(!r.ok)throw new Error("http");var j=await r.json();if(!j||j.error||typeof j.data!=="object")throw new Error("data");return j;}
  async function saveRequest(req){var snap;try{snap=await getSnapshot();}catch(e){return false;}if(!snap||typeof snap.data!=="object")return false;var list=arr(snap.data[RKEY]);list.push(req);snap.data[RKEY]=list;snap.updatedAt=Date.now();try{var res=await fetch(SYNC_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(snap)});return res.ok;}catch(e){return false;}}
  function plain(st){var v=state.ans[st.key];if(st.kind==="chips"&&st.multi)return arr(v).join(", ")||"\u2014";if(st.kind==="date"||st.kind==="monthday")return v||"No fixed date";return (v&&(""+v).trim())?v:"\u2014";}
  function summaryText(){return STEPS.map(function(st){return (st.label||st.key)+": "+plain(st);}).join("\n");}
  async function doSend(){
    var btn=document.getElementById("sendBtn"),note=document.getElementById("sendNote");
    btn.disabled=true; note.textContent="Sending\u2026";
    var req={id:uid(),createdAt:Date.now(),typeKey:(TYPE_KEY[state.ans.type]||"")}; STEPS.forEach(function(st){req[st.key]=state.ans[st.key];});
    var ok=await saveRequest(req);
    if(ok){
      compose.innerHTML="";
      botSay("Thank you \u2014 your request is in, and Sean will follow up soon.", function(){
        compose.innerHTML='<div class="compose-actions"><button class="btn" id="againBtn">Start another request</button></div>';
        document.getElementById("againBtn").onclick=start;
      });
    } else {
      btn.disabled=false;
      note.textContent="Couldn\u2019t reach the server \u2014 copy your request and send it to Sean directly.";
      if(!document.getElementById("copyBtn")){
        var row=document.createElement("div"); row.className="compose-actions"; row.innerHTML='<button class="btn" id="copyBtn">Copy request</button>';
        compose.insertBefore(row,note);
        document.getElementById("copyBtn").onclick=function(){var t=summaryText();try{navigator.clipboard.writeText(t);note.textContent="Copied to clipboard.";}catch(e){note.textContent="Select the summary above to copy.";}};
      }
    }
    scrollDown();
  }

  function start(){
    STEPS=[NAME_STEP,TEAM_STEP,TYPE_STEP];
    state={i:0,ans:{},multiSel:[],prompts:{},recentAcks:[],greeting:pick(GREETINGS)};
    thread.innerHTML=""; compose.innerHTML="";
    appendBubble("bot",esc(state.greeting),!reduce);
    setTimeout(function(){ botSay(esc(promptFor(0)), ask); }, reduce?0:450);
  }
  var rb=document.getElementById("resetBtn"); if(rb) rb.addEventListener("click",function(){ if(window.confirm("Start the intake over? This clears your current answers.")) start(); });
  start();
})();
</script>
  <script>
(function(){
  "use strict";
  var INDEX = [
    {t:"Request motion work", cat:"start", url:"intake.html", s:"Fill out the Intake Form to request a motion project \u2014 signature moments, icons, transitions, video and more.", kw:["request","intake","form","new project","brief","submit","need motion","ask for work","get started","commission"]},
    {t:"Types of motion work", cat:"start", url:"intake.html", s:"Project types include Signature Moment, Strategic Moment, Motion System, Icon, Effect, Transition, Video and Experience.", kw:["project types","signature moment","strategic moment","motion system","icon","effect","transition","video","experience","kinds"]},
    {t:"How to work with Sean", cat:"start", url:"about.html", s:"Motion Hub explains how to request work, follow status, browse past work, and learn the basics.", kw:["about","how to work","collaborate","overview","start here","welcome","help","getting started"]},
    {t:"Check current status", cat:"status", url:"manager.html", s:"Specialist Status shows what Sean is working on, what has shipped recently, and upcoming time off.", kw:["status","what is sean working on","in progress","delivered","shipped","upcoming","time off","pto","check in","update","progress"]},
    {t:"See past and completed motion work", cat:"work", url:"library.html", s:"The Motion Library is a visual showcase of delivered work \u2014 handy for references, inspiration, or aligning on a direction.", kw:["library","past work","completed","showcase","examples","references","gallery","previous","inspiration","see work","portfolio"]},
    {t:"Motion tools", cat:"tools", url:"tools.html", s:"Motion Tools collects the interactive things Sean has built for motion and UX work.", kw:["tools","interactive","try","utilities","widgets","apps","builder"]},
    {t:"User flow template", cat:"tools", url:"flows.html", s:"A storyboard tool for mapping flows step by step.", kw:["flow","user flow","storyboard","template","map","journey"]},
    {t:"Learn motion \u2014 the basics", cat:"learn", url:"learn.html", s:"A short, plain-language primer on how motion design works.", kw:["learn","basics","primer","intro","how motion works","education"]},
    {t:"Keyframes & keyframing", cat:"learn", url:"learn.html#vocabulary", s:"A keyframe stores a value at a moment in time; the software fills in the frames in between.", kw:["keyframe","keyframes","keyframing","key frame"]},
    {t:"Timelines", cat:"learn", url:"learn.html#vocabulary", s:"The timeline is where time runs left to right and you arrange layers, keyframes and the playhead.", kw:["timeline","playhead","track","tracks","sequence","layers"]},
    {t:"Easing (ease-in / ease-out)", cat:"learn", url:"learn.html#vocabulary", s:"Easing controls how motion speeds up or slows down so it feels natural instead of robotic.", kw:["easing","ease","ease in","ease out","ease-in","ease-out","acceleration","deceleration","curve feel"]},
    {t:"Tweening & interpolation", cat:"learn", url:"learn.html#vocabulary", s:"Tweens are the in-between frames the software generates from one keyframe to the next.", kw:["tween","tweening","interpolation","interpolate","in between","inbetween"]},
    {t:"Bezier curves", cat:"learn", url:"learn.html#vocabulary", s:"A bezier curve is the editable curve behind an ease; its handles shape how a value changes over time.", kw:["bezier","curve","curves","handles","graph editor"]},
    {t:"Frame rate (fps)", cat:"learn", url:"learn.html#vocabulary", s:"Frame rate is how many frames play each second \u2014 higher fps looks smoother.", kw:["fps","frame rate","framerate","frames per second"]},
    {t:"Duration & delay", cat:"learn", url:"learn.html#vocabulary", s:"Duration is how long a move takes; delay is a pause before it starts.", kw:["duration","delay","timing","milliseconds","length"]},
    {t:"Stagger", cat:"learn", url:"learn.html#vocabulary", s:"Staggering offsets the start of several elements so they cascade instead of moving all at once.", kw:["stagger","cascade","offset","sequence"]},
    {t:"Anticipation & follow-through", cat:"learn", url:"learn.html#vocabulary", s:"Anticipation is a small opposite move before an action; follow-through carries slightly past the target.", kw:["anticipation","follow through","follow-through","overshoot","wind up","settle","principles"]},
    {t:"Core concepts: keyframing, timelines, easing", cat:"learn", url:"learn.html#concepts", s:"Three core ideas that do most of the work in motion design.", kw:["concepts","core concepts","how it works","fundamentals"]},
    {t:"Ask a motion question (office hours)", cat:"learn", url:"learn.html#office-hours", s:"Post a question on Learn Motion and Sean answers it during office hours and the community of practice.", kw:["ask","question","office hours","community of practice","cop","help","q and a","qa","support"]},
    {t:"Book office hours (1:1)", cat:"learn", url:"learn.html#booktime", s:"Grab a weekly office-hours slot for a 1:1 \u2014 15 or 30 minutes on Wednesdays.", kw:["book","office hours","book time","1:1","one on one","slot","meeting","appointment","schedule","sign up","signup","time with sean","calendar"]},
    {t:"Community of Practice (RSVP)", cat:"learn", url:"learn.html#booktime", s:"RSVP for the bi-weekly community of practice \u2014 a group session for the whole team.", kw:["community of practice","cop","rsvp","group session","book time","meeting","sign up","signup","team session","learn together"]}
  ];
  var CATLABEL = {start:"Get started", learn:"Learn motion", work:"See work", tools:"Tools", status:"Status"};

  var overlay=document.getElementById("searchOverlay");
  var input=document.getElementById("searchInput");
  var results=document.getElementById("searchResults");
  var suggest=document.getElementById("searchSuggest");
  var filters=document.getElementById("searchFilters");
  var activeCat="all", lastFocus=null;

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function toks(s){return (s||"").toLowerCase().match(/[a-z0-9]+/g)||[];}

  function openO(){
    lastFocus=document.activeElement;
    overlay.hidden=false;
    document.body.style.overflow="hidden";
    render("");
    setTimeout(function(){input.focus();},30);
  }
  function closeO(){
    overlay.hidden=true;
    document.body.style.overflow="";
    if(lastFocus&&lastFocus.focus)lastFocus.focus();
  }

  function scoreEntry(e,q){
    var title=e.t.toLowerCase(), kw=e.kw.join(" | ").toLowerCase(), snip=e.s.toLowerCase();
    var qt=toks(q); if(!qt.length) return 0;
    var sc=0, ql=q.toLowerCase().trim();
    if(ql && (kw.indexOf(ql)>=0 || title.indexOf(ql)>=0)) sc+=6;
    qt.forEach(function(t){
      if(title.indexOf(t)>=0) sc+=3;
      else if(kw.indexOf(t)>=0) sc+=2;
      else if(snip.indexOf(t)>=0) sc+=1;
    });
    return sc;
  }

  function render(q){
    var qt=toks(q);
    if(!qt.length){ results.innerHTML=""; suggest.style.display=""; return; }
    suggest.style.display="none";
    var scored=INDEX
      .filter(function(e){return activeCat==="all"||e.cat===activeCat;})
      .map(function(e){return {e:e,s:scoreEntry(e,q)};})
      .filter(function(x){return x.s>0;})
      .sort(function(a,b){return b.s-a.s;})
      .slice(0,8);
    if(!scored.length){
      results.innerHTML='<p class="search-empty">Hmm, I couldn\u2019t find anything for \u201c'+esc(q)+'.\u201d Try rephrasing, or pick a different filter above.</p>';
      return;
    }
    var lead='<p class="search-lead">Here\u2019s what I found for \u201c'+esc(q)+'\u201d:</p>';
    results.innerHTML=lead+scored.map(function(x){
      var e=x.e;
      return '<a class="hs-result" href="'+esc(e.url)+'">'+
        '<span class="hs-result-cat">'+esc(CATLABEL[e.cat]||"")+'</span>'+
        '<span class="hs-result-title">'+esc(e.t)+'</span>'+
        '<span class="hs-result-snip">'+esc(e.s)+'</span>'+
        '<span class="hs-result-go">Open \u2192</span>'+
      '</a>';
    }).join("");
  }

  document.getElementById("helpBtn").addEventListener("click",openO);
  document.getElementById("searchClose").addEventListener("click",closeO);
  document.getElementById("searchBackdrop").addEventListener("click",closeO);
  document.addEventListener("keydown",function(ev){ if(ev.key==="Escape"&&!overlay.hidden) closeO(); });
  input.addEventListener("input",function(){ render(input.value); });
  input.addEventListener("keydown",function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); render(input.value); } });
  document.getElementById("searchGo").addEventListener("click",function(){ render(input.value); input.focus(); });
  filters.addEventListener("click",function(ev){
    var b=ev.target.closest(".hs-chip"); if(!b)return;
    activeCat=b.getAttribute("data-cat");
    Array.prototype.forEach.call(filters.querySelectorAll(".hs-chip"),function(c){ c.classList.toggle("active",c===b); });
    render(input.value);
  });
  suggest.addEventListener("click",function(ev){
    var b=ev.target.closest(".hs-pill"); if(!b)return;
    input.value=b.getAttribute("data-q");
    render(input.value); input.focus();
  });
})();
</script>
