function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
async function unlock(pw){var e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(pw.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-CBC',length:256},false,['decrypt']);
var t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(D.i)},key,b64(D.c)));
if(t.slice(0,3)!=='OK:')throw 0;
var st=document.getElementById('stage');st.innerHTML=t.slice(3);st.style.display='block';document.getElementById('gate').remove();addEventListener('resize',fit);fit()}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var err=document.getElementById('err');err.textContent='';
unlock(document.getElementById('pw').value).catch(function(){err.textContent='Incorrect password.'})};
