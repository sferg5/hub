<!doctype html>
<html lang="en" class="magnet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Builder</title>
<style>
@font-face{font-family:"Saans";src:url("lululemon-saans-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Saans Mono";src:url("saans-mono-regular.woff2") format("woff2");font-weight:400;font-display:swap}

:root{
  --ink:#141414; --mute:rgba(20,20,20,.56); --white:#FFFFFF;
  --ph:#EFECE8; --ph-line:rgba(20,20,20,.045); --ph-fg:rgba(20,20,20,.4);
  --sans:"Saans",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Saans Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --panel-w:392px;
  /* control panel tokens (always light, lululemon.com-style) */
  --red:#D22030;
  --p-bg:#FFFFFF; --p-fg:#141414; --p-mute:#6B6B6B; --p-line:#D5D5D5; --p-line-2:#EDEDED;
  --p-soft:#F6F6F6; --p-accent:#141414; --p-accent-fg:#FFFFFF;
  color-scheme:light;
}
html.magnet{scroll-snap-type:y proximity}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ================= stage =================
   One white stage that never changes. Media frames and type are the
   performers: scrolling moves them from one composition into the next. */
.stage{--g:clamp(20px,4.5cqw,64px);--top:calc(var(--g) + 28px);position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;overflow:hidden;background:var(--white);container-type:inline-size;transition:right .35s var(--ease-out)}
body.panel-open .stage{right:var(--panel-w)}
.spacer{position:relative;width:1px;pointer-events:none}
.snap{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}

.frames,.texts{position:absolute;inset:0}
.texts{pointer-events:none}
.frame{position:absolute;left:0;top:0;overflow:hidden;opacity:0;will-change:transform,width,height,opacity;contain:layout paint}
.lay{position:absolute;inset:0;visibility:hidden}
.lz{position:absolute;inset:0;transform-origin:50% 50%}
.lz video,.lz img{width:100%;height:100%;object-fit:cover;display:block}
.scrim{position:absolute;inset:0;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--ph);
  background-image:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 14px)}
.ph span{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ph-fg);text-align:center;padding:0 12px}
.ph--video::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:250% 100%;animation:sheen 6s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.ph--video::after{animation:none}}

/* text: one layer per section, positioned on a 3x3 grid */
.tr{position:absolute;inset:0;display:grid;padding:var(--top) var(--g) var(--g);visibility:hidden;color:var(--ink)}
.tr[data-ink="light"]{color:#fff;--mute:rgba(255,255,255,.78)}
.tr[data-ink="light"] .cta{background:#fff;color:var(--ink)}
.tr[data-layout="left"]{left:50%}
.tr[data-layout="right"]{right:50%}
.tr[data-x="left"] .copy{justify-self:start}
.tr[data-x="center"] .copy{justify-self:center}
.tr[data-x="right"] .copy{justify-self:end}
.tr[data-y="top"] .copy{align-self:start}
.tr[data-y="middle"] .copy{align-self:center}
.tr[data-y="bottom"] .copy{align-self:end}
.copy{pointer-events:auto;display:grid;gap:clamp(12px,1.8cqw,22px);max-width:min(100%,var(--cw))}
.copy.w-narrow{--cw:440px}.copy.w-medium{--cw:720px}.copy.w-wide{--cw:1120px}
.copy[data-align="left"]{text-align:left;justify-items:start}
.copy[data-align="center"]{text-align:center;justify-items:center}
.copy[data-align="right"]{text-align:right;justify-items:end}
.eb{font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hl{font-weight:700;line-height:.94;letter-spacing:-.025em;text-wrap:balance}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .12em;margin:0 -.03em -.12em}
.hl .c{display:inline-block}
.hl .w > span{display:inline-block}
.s-s .hl{font-size:clamp(28px,3.8cqw,56px)}
.s-m .hl{font-size:clamp(34px,5.6cqw,84px)}
.s-l .hl{font-size:clamp(40px,7.6cqw,116px)}
.s-xl .hl{font-size:clamp(46px,10.2cqw,156px)}
.hl.q{font-weight:600;line-height:1.04;letter-spacing:-.018em}
.s-xl .hl.q{font-size:clamp(38px,7cqw,108px)}
.attr{font:400 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bd{font:400 clamp(15px,1.25cqw,19px)/1.45 var(--sans);max-width:38ch}
.stats{display:flex;gap:clamp(20px,4cqw,56px);flex-wrap:wrap;margin-top:4px}
.stats div{display:grid;gap:6px}
.stats b{font:700 clamp(26px,3.6cqw,52px)/1 var(--sans);letter-spacing:-.02em}
.stats small{font:400 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cta{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 24px;border-radius:4px;background:var(--ink);color:var(--white);font:600 14px/1 var(--sans);text-decoration:none;margin-top:6px}

/* shoppable tiles: the frame becomes a product card that still glides */
.lay.shop{background:#fff}
.lay.shop .lz{bottom:64px;overflow:hidden}
.sl{position:absolute;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:8px 2px 4px;background:#fff;color:var(--ink)}
.sl b{display:block;font:600 14px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl small{font:400 13px/1.3 var(--sans);color:var(--mute)}
.qa{width:32px;height:32px;border-radius:50%;border:1px solid var(--ink);background:#fff;color:var(--ink);font-size:17px;line-height:1;flex:none}
.qa:hover{background:var(--ink);color:#fff}
.tag{position:absolute;top:10px;left:10px;z-index:2;background:#fff;color:var(--ink);font:600 11px/1 var(--sans);padding:5px 7px;border-radius:2px}
/* hotspots pinned to the image; they ride its camera move */
.spots{position:absolute;inset:0}
.spot{position:absolute;display:flex;align-items:center;gap:8px}
.spot.flip{flex-direction:row-reverse}
.spot i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.25);flex:none}
.spot span{background:#fff;color:var(--ink);border-radius:2px;padding:6px 9px;font:600 12px/1.25 var(--sans);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.spot span small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
/* numbered feature list */
.feats{display:grid;gap:12px;margin-top:4px;width:min(100%,44ch);text-align:left}
.feats div{display:grid;grid-template-columns:30px 1fr;gap:3px 10px;padding-top:12px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent)}
.feats em{font:400 11px/1.5 var(--mono);letter-spacing:.08em;font-style:normal;color:var(--mute);grid-row:span 2}
.feats b{font:600 15px/1.25 var(--sans)}
.feats small{font:400 14px/1.4 var(--sans);color:var(--mute)}
.toast{position:absolute;left:50%;bottom:24px;z-index:30;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:4px;font:600 13px/1 var(--sans);pointer-events:none;transition:opacity .25s,transform .35s var(--ease-out)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* product card */
.cw{position:absolute;inset:0;display:grid;padding:var(--top) var(--g) var(--g);visibility:hidden}
.cw[data-x="left"] .card{justify-self:start}.cw[data-x="center"] .card{justify-self:center}.cw[data-x="right"] .card{justify-self:end}
.cw[data-y="top"] .card{align-self:start}.cw[data-y="middle"] .card{align-self:center}.cw[data-y="bottom"] .card{align-self:end}
.card{pointer-events:auto;width:min(290px,80%);background:var(--white);color:var(--ink);border:1px solid #E6E6E6;border-radius:4px;padding:10px;display:grid;grid-template-columns:60px 1fr 34px;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.card .th{width:60px;height:72px;border-radius:2px;background:var(--ph);background-image:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 10px)}
.card p{font:600 14px/1.2 var(--sans)}
.card small{display:block;font:400 12px/1.3 var(--sans);color:var(--mute);margin-top:4px}
.card .add{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--white);font-size:18px;line-height:1}

/* phone-width preview: split text moves below the media */
@container (max-width:720px){
  .tr[data-layout="left"],.tr[data-layout="right"]{inset:50% 0 0 0;padding-top:var(--g)}
}

/* stage chrome */
.counter{position:absolute;top:18px;left:var(--g);z-index:10;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;pointer-events:none}
.dots{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:10;mix-blend-mode:difference}
.dots button{width:7px;height:7px;border-radius:50%;border:1px solid #fff;opacity:.6}
.dots button.on{background:#fff;opacity:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#9A9A9A;font:400 12px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:24px}

/* ================= control panel (lululemon.com style) ================= */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;height:44px;padding:0 22px;border-radius:4px;background:var(--p-accent);color:var(--p-accent-fg);font:600 14px/1 var(--sans);box-shadow:0 4px 16px rgba(0,0,0,.18);transition:right .35s var(--ease-out)}
body.panel-open .fab{right:calc(var(--panel-w) + 16px)}
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:50;background:var(--p-bg);color:var(--p-fg);border-left:1px solid var(--p-line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease-out);font:400 14px/1.45 var(--sans)}
body.panel-open .panel{transform:none}
.p-head{padding:20px 20px 16px;border-bottom:1px solid var(--p-line-2);display:grid;gap:14px}
.p-title{display:grid;gap:4px}
.p-title b{font:700 22px/1.1 var(--sans);letter-spacing:-.01em}
.p-title small{font-size:13px;color:var(--p-mute)}
.p-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-row .seg{flex:1}
.btn{height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--p-fg);background:#fff;font:600 13px/1 var(--sans);white-space:nowrap}
.btn:hover{background:var(--p-soft)}
.btn.pri{background:var(--p-accent);color:var(--p-accent-fg)}
.btn.pri:hover{background:#333}
.btn[disabled]{opacity:.35;cursor:default}
.linkbtn{font:400 13px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;color:var(--p-fg);padding:4px 0}
.linkbtn[disabled]{opacity:.35;cursor:default}
.p-list{border-bottom:1px solid var(--p-line-2);max-height:36vh;overflow:auto}
.p-list-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 10px;position:sticky;top:0;background:#fff;z-index:1}
.p-list-h b{font:600 15px/1 var(--sans)}
.lbl{font:600 13px/1.2 var(--sans);color:var(--p-fg)}
.row{display:grid;grid-template-columns:12px 38px 1fr auto;align-items:center;gap:10px;padding:10px 20px 10px 17px;cursor:pointer;border-left:3px solid transparent;border-top:1px solid var(--p-line-2)}
.row:hover{background:var(--p-soft)}
.row.is-sel{border-left-color:var(--p-fg);background:var(--p-soft)}
.row.drop-above{box-shadow:inset 0 2px 0 var(--red)}
.row.drop-below{box-shadow:inset 0 -2px 0 var(--red)}
.grip{color:#9A9A9A;cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none}
.row .nm{min-width:0;display:grid;gap:3px}
.row .nm b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-size:12px;color:var(--p-mute);text-transform:capitalize}
.row.is-sel{border-left-color:var(--bc,var(--p-fg))}
.bdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bc);margin-right:6px;vertical-align:1px}
.beats{display:flex;gap:5px;padding:10px 20px 8px 17px;border-top:1px solid var(--p-line-2);flex-wrap:wrap}
.bf{border:1px solid var(--p-line);background:#fff;border-radius:4px;height:26px;padding:0 7px;font:400 11.5px/1 var(--sans);color:var(--p-fg);display:inline-flex;align-items:center;cursor:pointer}
.bf small{margin-left:5px;color:var(--p-mute);font-size:11px}
.bf.on{border-color:var(--p-fg);background:var(--p-soft)}
.bf:hover{border-color:var(--p-fg)}
.row.is-cur .nm b::after{content:"· on stage";margin-left:6px;font-weight:400;font-size:11px;color:var(--red)}
.acts{display:flex;gap:0}
.ib{width:26px;height:26px;border-radius:4px;color:var(--p-mute);font-size:14px;line-height:1}
.ib:hover:not([disabled]){background:#fff;color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-line)}
.ib[disabled]{opacity:.3;cursor:default}
.mini{position:relative;width:38px;height:24px;border-radius:2px;overflow:hidden;border:1px solid var(--p-line)}
.mini i{position:absolute;display:block}
.mini .mm{background:#9A9A9A;opacity:.45}
.mini .mt{height:3px;width:10px;background:var(--p-fg);border-radius:1px}
.p-insp{flex:1;overflow:auto;padding:0 20px 48px}
.p-insp-h{padding:16px 0 4px;display:grid;gap:2px}
.p-insp-h small{font-size:12px;color:var(--p-mute)}
.p-insp-h b{font:700 18px/1.2 var(--sans)}
/* accordions, like product-page details */
details.grp{border-bottom:1px solid var(--p-line)}
details.grp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer;font:600 15px/1.2 var(--sans)}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";font:400 22px/1 var(--sans)}
details.grp[open] summary::after{content:"−"}
details.grp .gb{padding:0 0 16px}
.f{display:grid;gap:8px;margin-bottom:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],textarea,select{width:100%;background:#fff;border:1px solid var(--p-line);border-radius:4px;padding:10px 12px;color:inherit;font:400 14px/1.3 var(--sans)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-fg)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#141414 50%),linear-gradient(135deg,#141414 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;cursor:pointer}
textarea{resize:vertical;min-height:60px}
input[type=range]{width:100%;accent-color:var(--p-fg)}
/* option chips, like the size selector */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 0 auto;min-width:44px;height:40px;padding:0 10px;border:1px solid var(--p-line);border-radius:4px;background:#fff;font:400 13px/1 var(--sans);color:var(--p-fg);white-space:nowrap}
.seg button:hover{border-color:var(--p-fg)}
.seg button[aria-pressed="true"]{border-color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-fg);font-weight:600}
.pos{display:flex;gap:16px;align-items:center}
.g9{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:120px;aspect-ratio:16/10;padding:6px;border:1px solid var(--p-line);border-radius:4px;background:#fff}
.g9 button{border-radius:2px;display:grid;place-items:center}
.g9 button::after{content:"";width:14px;height:3px;border-radius:1px;background:#BDBDBD}
.g9 button:hover{background:var(--p-soft)}
.g9 button[aria-pressed="true"]{background:var(--p-fg)}
.g9 button[aria-pressed="true"]::after{background:#fff}
.pos small{color:var(--p-mute);font-size:13px;text-transform:capitalize}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw button[aria-pressed="true"]{outline:1px solid var(--p-fg);outline-offset:3px}
.hint{font-size:13px;color:var(--p-mute);margin:-6px 0 16px}
.none{padding:32px 0;color:var(--p-mute);text-align:center}

/* section pool */
.pool-h{padding:16px 0 4px;display:grid;gap:4px}
.pool-h b{font:700 18px/1.2 var(--sans)}
.pool-h small{font-size:13px;color:var(--p-mute)}
.pool-f{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px}
.pool h4{font:600 14px/1.2 var(--sans);margin:18px 0 10px;display:flex;justify-content:space-between}
.pool h4 small{font-weight:400;color:var(--p-mute)}
.pool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{display:grid;gap:7px;text-align:left;padding:6px 6px 8px;border:1px solid var(--p-line);border-radius:4px;background:#fff;cursor:grab}
.pc:hover{border-color:var(--p-fg)}
.pc:active{cursor:grabbing}
.pc .nm{display:grid;gap:3px;padding:0 2px}
.pc .nm b{font:600 13px/1.2 var(--sans)}
.pc .nm small{font-size:11.5px;color:var(--p-mute);text-transform:capitalize}
.pc.added{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pt{position:relative;aspect-ratio:16/10;background:#fff;border:1px solid var(--p-line-2);border-radius:2px;overflow:hidden;pointer-events:none}
.pt .pf{position:absolute;background:#E9E6E1 center/cover no-repeat}
.pt .pr{position:absolute;top:0;bottom:0;display:grid;padding:9% 6% 7%}
.pt .pf.shop{box-shadow:inset 0 -7px 0 #fff, inset 0 -8px 0 #DDD}
.pt .pdot{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.pt .pb{display:flex;flex-direction:column;gap:3px}
.pt .pb i{display:block;height:3px;border-radius:1px;background:var(--ink)}
.pt .pb i.h{height:var(--hh)}
.pt .pb i.e{height:2px;width:22%;opacity:.5}
.pt .pb i.b{height:2px;opacity:.55}
.pt .pb i.c{height:7px;width:26%;border-radius:1px;margin-top:2px}
.pt .pb.light i{background:#fff}
.pt .pcd{position:absolute;width:24%;height:17%;background:#fff;border:1px solid #DDD;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.p-list-h .btn[aria-pressed="true"]{background:var(--p-accent);color:var(--p-accent-fg)}
#list.drop-end{box-shadow:inset 0 -2px 0 var(--red)}

/* tabs */
.tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--p-line)}
.tabs button{position:relative;padding:14px 0 12px;font:600 15px/1 var(--sans);color:var(--p-mute)}
.tabs button[aria-selected="true"]{color:var(--p-fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--p-fg)}
.tabs .count{font-weight:400;color:var(--p-mute);margin-left:4px}
.view{display:flex;flex-direction:column;flex:1;min-height:0}
.view[hidden]{display:none}
/* library */
.lib{flex:1;overflow:auto;padding:16px 20px 48px}
.lib-drop{border:1px dashed var(--p-line);border-radius:4px;padding:16px;text-align:center;display:grid;gap:10px;justify-items:center;margin-bottom:16px;color:var(--p-mute);font-size:13px}
.lib-drop.over{border-color:var(--red);border-style:solid;background:#FDF4F5}
.lib-drop .p-row{justify-content:center}
.pending{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--p-fg);color:#fff;border-radius:4px;padding:10px 12px;margin-bottom:16px;font-size:13px}
.pending button{color:#fff;text-decoration:underline;font-size:13px}
.lib h4{font:600 14px/1.2 var(--sans);margin:18px 0 10px;display:flex;justify-content:space-between}
.lib h4 small{font-weight:400;color:var(--p-mute)}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.asset{position:relative;aspect-ratio:4/5;border-radius:2px;overflow:hidden;background:var(--p-soft);cursor:grab;outline:1px solid transparent}
.asset:hover{outline-color:var(--p-fg)}
.asset.picking{cursor:pointer}
.asset img,.asset video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.asset .badge{position:absolute;left:6px;bottom:6px;font:400 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--p-fg);padding:4px 5px;border-radius:2px}
.asset .del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#fff;font-size:13px;line-height:1;opacity:0}
.asset:hover .del{opacity:1}
.asset .used{position:absolute;top:6px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
/* media slots in the inspector */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;aspect-ratio:4/5;border:1px dashed var(--p-line);border-radius:4px;overflow:hidden;display:grid;place-items:center;font-size:11px;color:var(--p-mute);text-align:center;padding:4px;cursor:pointer;background:#fff}
.slot:hover{border-color:var(--p-fg)}
.slot.over{border:2px solid var(--red)}
.slot.filled{border-style:solid;padding:0}
.slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.slot .res{position:absolute;left:3px;right:3px;bottom:3px;z-index:1;border-radius:2px;padding:3px 4px;font:600 10px/1.1 var(--sans);text-align:center;background:#fff;color:var(--p-fg)}
.slot .res.low{background:var(--red);color:#fff}
.slot .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;font-size:12px;line-height:1;z-index:1}
/* dropping onto the stage */
.frame.drop-target::after{content:"Drop to place";position:absolute;inset:0;display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--red);background:rgba(210,32,48,.08);color:var(--red);font:600 13px/1 var(--sans);z-index:5}
.stage.drop-new::after{content:"Drop to add media to this section";position:absolute;inset:24px;display:grid;place-items:center;border:2px dashed var(--red);color:var(--red);font:600 14px/1 var(--sans);z-index:20;pointer-events:none}

@media (max-width:760px){
  :root{--panel-w:100vw}
  .panel{top:auto;height:64vh;width:100%;border-left:0;border-top:1px solid var(--p-line);transform:translateY(100%)}
  body.panel-open .stage{right:0}
  body.panel-open .fab{right:16px;bottom:calc(64vh + 12px)}
  .p-list{max-height:26vh}
}
</style>
</head>
<body class="panel-open">

<main class="stage" id="stage" aria-label="Story preview"></main>
<div class="spacer" id="spacer" aria-hidden="true"></div>

<button class="fab" id="fab" aria-controls="panel" aria-expanded="true">Close editor</button>

<aside class="panel" id="panel" aria-label="Story controls">
  <div class="p-head">
    <div class="p-title"><b>Story Builder</b><small>Scroll moves one composition into the next.</small></div>
    <select id="preset" aria-label="Load a preset">
      <option value="">Start from a preset</option>
      <option value="align">Sample arc · 8 sections</option>
      <option value="lockups">Hero lockups (same hero, 6 ways)</option>
      <option value="pool">City Run pool · 20 sections, 5 per beat</option>
      <option value="blank">Blank · one hero</option>
    </select>
    <div class="p-row">
      <button class="btn pri" id="remix" title="Randomize layouts, keep copy">Remix layouts</button>
      <button class="btn" id="export">Export</button>
      <button class="btn" id="import">Import</button>
      <button class="linkbtn" id="undo" title="Undo (⌘Z)">Undo</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
    <details class="grp" id="pageset" style="border-bottom:0;border-top:1px solid var(--p-line-2);margin:0 -20px -16px;padding:0 20px">
      <summary>Page settings</summary>
      <div class="gb">
        <div class="f"><span class="lbl">Scroll feel</span><div class="seg" id="magnet" role="group" aria-label="Scroll feel"></div></div>
        <div class="f"><span class="lbl">Section name on stage</span><div class="seg" id="showname" role="group" aria-label="Section name on stage"></div></div>
        <div class="f"><span class="lbl">Scroll speed</span><div class="pos" id="pace"></div></div>
        <p class="hint">Higher means less scrolling for each section.</p>
        <div class="f"><span class="lbl">Smoothing</span><div class="seg" id="smooth" role="group" aria-label="Smoothing"></div></div>
        <div class="f"><span class="lbl">Transition length</span><div class="pos" id="trans"></div></div>
        <div class="f"><span class="lbl">Motion while held · strength</span><div class="pos" id="holdamt"></div></div>
      </div>
    </details>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-sections" aria-selected="true">Sections</button>
    <button role="tab" id="tab-library" aria-selected="false">Library<span class="count" id="lib-count"></span></button>
  </nav>
  <div class="view" id="view-sections">
  <div class="p-list">
    <div class="p-list-h">
      <b>Story order</b>
      <button class="btn" id="add" aria-pressed="false">+ Add section</button>
    </div>
    <div class="beats" id="beatfilter" role="group" aria-label="Filter by beat"></div>
    <div id="list" role="list"></div>
  </div>
  <div class="p-insp" id="insp"></div>
  </div>
  <div class="view" id="view-library" hidden>
    <div class="lib" id="lib"></div>
  </div>
  <input type="file" id="lib-file" accept="image/*,video/*" multiple hidden>
</aside>

<script>
(() => {
/* ---------- helpers ---------- */
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') for (const [sk, sv] of Object.entries(v)) sk.startsWith('--') ? e.style.setProperty(sk, sv) : (e.style[sk] = sv);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIn = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 4);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clone = o => JSON.parse(JSON.stringify(o));
const merge = (a, b) => {
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = merge(a[k] && typeof a[k] === 'object' ? a[k] : {}, b[k]);
    else a[k] = b[k];
  }
  return a;
};

const MOTIONS = {
  glide:    ['Glide',    'Frames glide and resize from the last composition into this one.'],
  rise:     ['Rise',     'Frames glide while the new imagery and copy rise into place.'],
  iris:     ['Iris',     'New imagery opens from the center of each frame as it moves.'],
  dissolve: ['Dissolve', 'The last composition fades to white, then this one fades up.'],
};
const FR = 4; // frames on stage: one per gallery tile at most

/* How a section's copy arrives (and leaves). All scroll-driven, so every one scrubs backwards. */
const TYPE_ANIMS = {
  rise:    ['Rise',       'Words rise out of the line, one after another.'],
  cascade: ['Cascade',    'Each word fades and lifts into place in sequence.'],
  letters: ['Letters',    'Character by character, rising out of the line.'],
  type:    ['Typewriter', 'Characters appear in reading order. No movement.'],
  fade:    ['Fade',       'The whole copy block fades in with a short lift.'],
  blur:    ['Blur',       'The copy resolves out of a blur.'],
  scale:   ['Scale',      'The copy settles down from slightly larger.'],
  wipe:    ['Wipe',       'A wipe reveals the copy from its aligned edge.'],
};
const perLetter = s => s.text.anim === 'letters' || s.text.anim === 'type';

/* Every section shares one shape. "Type" only picks starting values,
   so any section can become any composition. */
const BASE = () => ({
  id: uid(), name: 'Section', beat: 'build', motion: 'glide', hold: 'push', dwell: 1,
  media: { kind: 'video', layout: 'full', items: [], inset: 'm', mx: 'center', count: 3, arrange: 'row', fit: 'auto' },
  text: { x: 'left', y: 'bottom', align: 'auto', width: 'medium', size: 'xl', ink: 'dark', anim: 'rise' },
  overlay: 30, eyebrow: '', showEyebrow: false, headline: 'Headline', body: '',
  cta: { show: false, label: 'Shop now' },
  quote: { on: false, attr: '' },
  stats: { on: false, items: [{ v: '', l: '' }, { v: '', l: '' }, { v: '', l: '' }] },
  shop: { on: false, items: [0, 1, 2, 3].map(() => ({ name: 'Product name', price: '$XX', tag: '' })) },
  spots: { on: false, items: [{ x: 30, y: 35, label: 'Feature', sub: '' }, { x: 62, y: 55, label: 'Feature', sub: '' }, { x: 40, y: 72, label: '', sub: '' }] },
  feats: { on: false, items: [{ t: 'Feature', d: 'One line on why it matters.' }, { t: 'Feature', d: 'One line on why it matters.' }, { t: '', d: '' }] },
  card: { on: false, x: 'right', y: 'bottom', name: 'Product name', price: '$XX' },
});
const make = o => merge(BASE(), clone(o));

/* Story beats. Every section carries one; a story reads Hook → Feel → Proof → Close,
   so any pool of tagged sections can be re-ordered into a new story. */
const BEATS = {
  hook:  { label:'Hook',  color:'#c8202f', hint:'Opens the story. One image, one line, a reason to keep going.' },
  build: { label:'Build', color:'#d98a1f', hint:'Develops the idea. Atmosphere, movement, the world of the story.' },
  proof: { label:'Proof', color:'#2f6fb3', hint:'Why to believe it. Detail, numbers, a real voice.' },
  close: { label:'Close', color:'#1f8a5b', hint:'Where it lands. The ask and the way out.' },
};
const BEAT_ORDER = Object.keys(BEATS);

const STARTERS = {
  hero:      { label:'Hero · full-bleed video', o:{ name:'Hero', beat:'hook', eyebrow:'Eyebrow', headline:'A headline that opens the story', cta:{show:true,label:'Shop now'} } },
  split:     { label:'Split · media + text', o:{ name:'Split', beat:'build', media:{kind:'image',layout:'left'}, text:{x:'left',y:'middle',size:'m',width:'narrow'}, eyebrow:'Chapter', headline:'Half image, half story', body:'Body copy sits beside the image and carries the narrative forward.' } },
  inset:     { label:'Inset · framed media', o:{ name:'Inset', beat:'build', media:{kind:'image',layout:'inset',mx:'right',inset:'m'}, overlay:0, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'A framed moment', body:'Room around the image lets the type breathe.' } },
  statement: { label:'Statement · type only', o:{ name:'Statement', beat:'build', media:{kind:'none'}, text:{x:'center',y:'middle',size:'l',width:'wide'}, headline:'One big line that lands the idea.' } },
  gallery:   { label:'Gallery · image tiles', o:{ name:'Gallery', beat:'build', media:{kind:'gallery',layout:'full',count:3,arrange:'row'}, overlay:0, text:{x:'left',y:'top',size:'s',width:'medium'}, headline:'Three moments' } },
  product:   { label:'Product · image + card', o:{ name:'Product', beat:'proof', media:{kind:'image',layout:'inset',mx:'right',inset:'l'}, overlay:0, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'The product, in the story', body:'Short product line.', card:{on:true,x:'left',y:'bottom'} } },
  quote:     { label:'Quote', o:{ name:'Quote', beat:'proof', media:{kind:'none'}, text:{x:'center',y:'middle',size:'xl',width:'wide'}, headline:'A line from a real person.', quote:{on:true,attr:'Name, role'} } },
  stats:     { label:'Stats · numbers row', o:{ name:'Stats', beat:'proof', media:{kind:'image',layout:'right'}, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'By the numbers', stats:{on:true,items:[{v:'01',l:'Detail'},{v:'02',l:'Detail'},{v:'03',l:'Detail'}]} } },
  closer:    { label:'Closer · end CTA', o:{ name:'Closer', beat:'close', media:{kind:'video',layout:'full'}, overlay:40, text:{x:'center',y:'middle',size:'l',width:'medium'}, headline:'Where the story ends', cta:{show:true,label:'Shop the collection'} } },
};

/* Presets are written as a sequence: each composition sets up the next move. */
const PRESETS = {
  align: () => [
    make({ name:'Opening', beat:'hook', hold:'push', media:{kind:'video',layout:'full'}, text:{x:'left',y:'bottom',size:'xl'}, overlay:34,
      eyebrow:'00:00', headline:'Feel nothing but the practice.', body:'One class, start to finish, in the Align pant.', cta:{show:true,label:'Shop Align'} }),
    make({ name:'Atmosphere', beat:'build', hold:'drift', media:{kind:'video',layout:'inset',mx:'right',inset:'m'}, overlay:0, text:{x:'left',y:'middle',size:'l',width:'narrow'},
      eyebrow:'04:00', headline:'Buttery-soft. Weightless.' }),
    make({ name:'Movement', beat:'build', hold:'pan', media:{kind:'image',layout:'left'}, text:{x:'left',y:'bottom',size:'m',width:'narrow'},
      eyebrow:'12:00', headline:'Every transition, uninterrupted.', body:'Nulu fabric stays with you from down dog to warrior without a second thought.' }),
    make({ name:'Rhythm', beat:'build', hold:'drift', media:{kind:'gallery',layout:'full',count:3,arrange:'stagger'}, overlay:0, text:{x:'left',y:'top',size:'s'}, motion:'rise',
      eyebrow:'24:00', headline:'Hold still. Nothing shifts.' }),
    make({ name:'Detail', beat:'proof', hold:'drift', media:{kind:'image',layout:'inset',mx:'right',inset:'l'}, overlay:0, text:{x:'left',y:'middle',size:'m',width:'narrow'},
      eyebrow:'31:00', headline:'The pant.', body:'High rise, no side seams, a hidden waistband pocket.', card:{on:true,x:'left',y:'bottom',name:'Align High-Rise Pant 28"',price:'$XX'} }),
    make({ name:'Numbers', beat:'proof', hold:'pan', media:{kind:'image',layout:'right'}, text:{x:'left',y:'middle',size:'m',width:'narrow'},
      eyebrow:'38:00', headline:'Built for the deep end of class.', stats:{on:true,items:[{v:'28″',l:'Inseam'},{v:'4-way',l:'Stretch'},{v:'0',l:'Side seams'}]} }),
    make({ name:'Voice', beat:'proof', media:{kind:'none'}, text:{x:'center',y:'middle',size:'xl',width:'wide'},
      eyebrow:'55:00', headline:'I forgot I was wearing anything at all.', quote:{on:true,attr:'Placeholder quote'} }),
    make({ name:'Ending', beat:'close', hold:'push', media:{kind:'video',layout:'full'}, overlay:36, text:{x:'center',y:'middle',size:'l'}, motion:'iris',
      eyebrow:'60:00', headline:'Take it with you.', cta:{show:true,label:'Shop the Align collection'} }),
  ],
  lockups: () => {
    const c = { beat:'hook', eyebrow:'New in', headline:'Feel nothing but the practice.', body:'The same hero, six lockups.', cta:{show:true,label:'Shop Align'}, overlay:34 };
    return [
      make({ ...c, name:'Bottom left', text:{x:'left',y:'bottom',size:'xl'} }),
      make({ ...c, name:'Centered', hold:'push', text:{x:'center',y:'middle',size:'xl',width:'wide'}, overlay:40 }),
      make({ ...c, name:'Split · video right', hold:'pan', media:{kind:'video',layout:'right'}, text:{x:'left',y:'bottom',size:'l',width:'narrow'} }),
      make({ ...c, name:'Inset left', hold:'drift', media:{kind:'video',layout:'inset',mx:'left',inset:'l'}, overlay:0, text:{x:'right',y:'middle',size:'m',width:'narrow'} }),
      make({ ...c, name:'Inset center', hold:'drift', media:{kind:'video',layout:'inset',mx:'center',inset:'s'}, overlay:0, text:{x:'center',y:'bottom',size:'m',width:'wide'}, body:'' }),
      make({ ...c, name:'Top right', hold:'pan', text:{x:'right',y:'top',size:'l',width:'narrow'}, motion:'iris', card:{on:true,x:'left',y:'bottom',name:'Align High-Rise Pant 28"',price:'$XX'} }),
    ];
  },
  /* City Run pool. Placement follows the photos:
     - full-bleed frames get the three big landscape shots (02, 11, 16);
     - halves and framed insets get the tall editorial shots (01, 10, 12–15, 20–23);
     - small tiles get the narrower portraits (17–19);
     - product moments and product grids get the flat lays (03–09), shown whole;
     - 24 and 25 are too small for anything larger than a thumbnail, so they sit out. */
  pool: () => {
    const im = n => 'b:story-library/cityrun-' + String(n).padStart(2, '0') + '.jpg';
    const I = (...n) => ({ items: n.map(im) });
    const P = (name, tag = '') => ({ name, price:'$XX', tag });
    return [
      // Hook — five ways to open
      make({ beat:'hook', name:'Cold open', hold:'push', media:{kind:'image',layout:'full', ...I(11)}, text:{x:'left',y:'bottom',size:'xl'}, overlay:34,
        eyebrow:'City Run', headline:'The city is the track.' }),
      make({ beat:'hook', name:'Statement open', media:{kind:'none'}, text:{anim:'letters',x:'center',y:'middle',size:'xl',width:'wide'},
        eyebrow:'City Run', headline:'Wake the legs.' }),
      make({ beat:'hook', name:'Split open', hold:'pan', media:{kind:'image',layout:'right', ...I(1)}, text:{anim:'cascade',x:'left',y:'middle',size:'l',width:'narrow'},
        eyebrow:'5:48 am', headline:'Before the city wakes up.', body:'One route, thirty minutes, no plan past the next corner.' }),
      make({ beat:'hook', name:'Inset open', hold:'drift', media:{kind:'image',layout:'inset',mx:'right',inset:'m', ...I(13)}, overlay:0, text:{anim:'fade',x:'left',y:'middle',size:'l',width:'narrow'},
        eyebrow:'City Run', headline:'Out the door.' }),
      make({ beat:'hook', name:'Triptych open', hold:'drift', media:{kind:'gallery',layout:'full',count:3,arrange:'stagger', ...I(17,18,19)}, overlay:0, text:{anim:'wipe',x:'left',y:'top',size:'m'}, motion:'rise',
        eyebrow:'City Run', headline:'Three blocks in.' }),
      // Build — what it is like
      make({ beat:'build', name:'Split moment', hold:'pan', media:{kind:'image',layout:'left', ...I(15)}, text:{anim:'cascade',x:'left',y:'bottom',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'Hold the pace.', body:'Light enough to forget, warm enough to keep going.' }),
      make({ beat:'build', name:'Framed moment', hold:'drift', media:{kind:'image',layout:'inset',mx:'center',inset:'m', ...I(14)}, overlay:0, text:{anim:'blur',x:'center',y:'bottom',size:'m',width:'wide'},
        eyebrow:'City Run', headline:'Breathe with the traffic lights.' }),
      make({ beat:'build', name:'Full-bleed moment', hold:'push', media:{kind:'image',layout:'full', ...I(2)}, text:{anim:'scale',x:'right',y:'top',size:'l',width:'narrow',ink:'light'}, overlay:34,
        eyebrow:'City Run', headline:'Louder than the traffic.' }),
      make({ beat:'build', name:'Mosaic', hold:'drift', media:{kind:'gallery',layout:'full',count:3,arrange:'mosaic', ...I(12,21,22)}, overlay:0, text:{anim:'wipe',x:'left',y:'top',size:'s'},
        eyebrow:'City Run', headline:'Nobody runs alone.' }),
      make({ beat:'build', name:'Statement', media:{kind:'none'}, text:{anim:'type',x:'left',y:'middle',size:'l',width:'wide'},
        eyebrow:'City Run', headline:'Every corner is a decision. Every decision is a run.' }),
      // Proof — why to believe it: the product, shown whole
      make({ beat:'proof', name:'Product close-up', hold:'drift', media:{kind:'image',layout:'inset',mx:'right',inset:'l', ...I(6)}, overlay:0, text:{anim:'fade',x:'left',y:'middle',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'The wind jacket.', body:'Placeholder: packs small, sheds the first rain.', card:{on:true,x:'left',y:'bottom',name:'Wind Jacket',price:'$XX'} }),
      make({ beat:'proof', name:'Numbers', hold:'pan', media:{kind:'image',layout:'right', ...I(10)}, text:{anim:'cascade',x:'left',y:'middle',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'By the numbers.', stats:{on:true,items:[{v:'00',l:'Placeholder'},{v:'00',l:'Placeholder'},{v:'00',l:'Placeholder'}]} }),
      make({ beat:'proof', name:'Voice', media:{kind:'none'}, text:{anim:'type',x:'center',y:'middle',size:'xl',width:'wide'},
        eyebrow:'City Run', headline:'I stopped thinking about what I was wearing by the first bridge.', quote:{on:true,attr:'Run club member, Vancouver'} }),
      make({ beat:'proof', name:'Product pair', hold:'drift', media:{kind:'gallery',layout:'full',count:2,arrange:'row', ...I(4,7)}, overlay:0, text:{anim:'letters',x:'left',y:'top',size:'s'},
        shop:{ on:true, items:[P('Gradient Tank'), P('Layered Tank', 'New')] },
        eyebrow:'City Run', headline:'Two ways to layer.' }),
      make({ beat:'proof', name:'Second product', hold:'drift', media:{kind:'image',layout:'inset',mx:'left',inset:'l', ...I(3)}, overlay:0, text:{anim:'fade',x:'right',y:'middle',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'Warm for the way home.', body:'Pull it on after the cool-down.', card:{on:true,x:'right',y:'bottom',name:'Fleece Jacket',price:'$XX'} }),
      // Close — where it lands
      make({ beat:'close', name:'Shop close', hold:'push', media:{kind:'image',layout:'full', ...I(16)}, overlay:36, text:{anim:'scale',x:'center',y:'top',size:'l',width:'medium'}, motion:'iris',
        eyebrow:'City Run', headline:'Run the city.', cta:{show:true,label:'Shop the collection'} }),
      make({ beat:'close', name:'Quiet close', media:{kind:'none'}, text:{anim:'letters',x:'center',y:'middle',size:'l',width:'wide'},
        eyebrow:'City Run', headline:'The road forward is yours.', cta:{show:true,label:'Find a run club'} }),
      make({ beat:'close', name:'Split close', hold:'pan', media:{kind:'image',layout:'left', ...I(20)}, text:{anim:'cascade',x:'left',y:'bottom',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'Same time tomorrow.', body:'Save the route. Bring someone.', cta:{show:true,label:'Plan a route'} }),
      make({ beat:'close', name:'Inset close', hold:'drift', media:{kind:'image',layout:'inset',mx:'right',inset:'m', ...I(23)}, overlay:0, text:{anim:'blur',x:'left',y:'middle',size:'m',width:'narrow'},
        eyebrow:'City Run', headline:'Take it with you.', cta:{show:true,label:'Shop now'} }),
      make({ beat:'close', name:'Product lineup', hold:'drift', media:{kind:'gallery',layout:'full',count:3,arrange:'row', ...I(9,5,8)}, overlay:0, text:{anim:'wipe',x:'center',y:'top',size:'m',width:'wide'},
        shop:{ on:true, items:[P('Mesh Tank'), P('Gradient Short', 'New'), P('Run Short')] },
        eyebrow:'City Run', headline:'See you at the start.', cta:{show:true,label:'Shop the kit'} }),
    ];
  },
  blank: () => [make(STARTERS.hero.o)],
};

/* ---------- state ---------- */
const KEY = 'storyBuilder.v2';
let S, sel = null, history = [];
const normalize = d => ({
  magnet: d.magnet !== false,
  showName: d.showName === true,
  trans: clamp(+d.trans || 1, .5, 2),
  holdAmt: clamp(+d.holdAmt || 1, .4, 2),
  pace: clamp(+d.pace || 1.5, .6, 2.5),
  smooth: d.smooth !== false,
  sections: (d.sections || []).map(s => {

  $('showname').replaceChildren(...seg([[false,'Off'],[true,'On']], S.showName, act(v => S.showName = v)).childNodes);
  $('trans').replaceChildren(...slider(.5, 2, .1, S.trans, v => v.toFixed(1) + ' screens', v => S.trans = v, () => { measure(); update(); }).childNodes);
  $('pace').replaceChildren(...slider(.6, 2.5, .1, S.pace, v => v.toFixed(1) + '×', v => S.pace = v, () => { measure(); update(); }).childNodes);
  $('smooth').replaceChildren(...seg([[true,'Light'],[false,'Off']], S.smooth, act(v => S.smooth = v)).childNodes);
  $('holdamt').replaceChildren(...slider(.4, 2, .1, S.holdAmt, v => v.toFixed(1) + '×', v => S.holdAmt = v, update).childNodes);
  document.documentElement.classList.toggle('magnet', S.magnet);
}
function render() { renderGlobals(); renderStage(); renderList(); renderInspector(); if (!$('view-library').hidden) renderLibrary(); save(); }

$('add').addEventListener('click', () => setPool(!poolOpen));
$('preset').addEventListener('change', e => {
  const k = e.target.value; e.target.value = ''; if (!k) return;
  snapshot(); S.sections = PRESETS[k](); sel = S.sections[0].id; render(); scrollTo(0, 0);
});
$('remix').addEventListener('click', act(() => {
  S.sections.forEach((s, i) => {
    if (s.media.kind !== 'none') s.media.layout = pick(i === 0 ? ['full','full','right','left'] : ['full','left','right','inset','inset']);
    s.media.mx = pick(['left','center','right']); s.media.inset = pick(['m','l']);
    s.text.x = pick(['left','center','right']); s.text.y = pick(['top','middle','bottom']); s.text.align = 'auto';
    if (s.card.on) { s.card.x = pick(['left','right']); s.card.y = pick(['top','bottom']); }
    if (i) s.motion = pick(['glide','glide','rise','iris','dissolve']);
    s.hold = pick(['push','pan','drift']);
  });
}));
$undo.addEventListener('click', undo);
$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = h('a', { href:URL.createObjectURL(blob), download:'story-layout.json' }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = normalize(JSON.parse(await f.text())); if (!d.sections.length) throw 0; snapshot(); S = d; sel = S.sections[0].id; render(); }
  catch (err) { alert('That file is not a Story Builder layout.'); }
});

const $fab = $('fab');
function togglePanel(force) {
  const open = document.body.classList.toggle('panel-open', force);
  $fab.textContent = open ? 'Close editor' : 'Edit story'; $fab.setAttribute('aria-expanded', String(open));
  setTimeout(() => { measure(); update(); }, 380);
}
$fab.addEventListener('click', () => togglePanel());
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  else if (!typing && e.key.toLowerCase() === 'e' && !e.metaKey && !e.ctrlKey) togglePanel();
});

render();
loadUserAssets();
})();
</script>
</body>
