<!doctype html>
<html lang="en" class="magnet">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Builder</title>
<style>
@font-face{font-family:"Saans";src:url("lululemon-saans-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Saans Mono";src:url("saans-mono-regular.woff2") format("woff2");font-weight:400;font-display:swap}

:root{
  --ink:#141414; --mute:rgba(20,20,20,.56); --white:#FFFFFF;
  --ph:#EFECE8; --ph-line:rgba(20,20,20,.045); --ph-fg:rgba(20,20,20,.4);
  --sans:"Saans",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Saans Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease-out:cubic-bezier(.16,1,.3,1);
  --panel-w:392px;
  /* control panel tokens (always light, lululemon.com-style) */
  --red:#D22030;
  --p-bg:#FFFFFF; --p-fg:#141414; --p-mute:#6B6B6B; --p-line:#D5D5D5; --p-line-2:#EDEDED;
  --p-soft:#F6F6F6; --p-accent:#141414; --p-accent-fg:#FFFFFF;
  color-scheme:light;
}
html.magnet{scroll-snap-type:y proximity}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ================= stage =================
   One white stage that never changes. Media frames and type are the
   performers: scrolling moves them from one composition into the next. */
.stage{--g:clamp(20px,4.5cqw,64px);--top:calc(var(--g) + 28px);position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;overflow:hidden;background:var(--white);container-type:inline-size;transition:right .35s var(--ease-out)}
body.panel-open .stage{right:var(--panel-w)}
.spacer{position:relative;width:1px;pointer-events:none}
.snap{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}

.frames,.texts{position:absolute;inset:0}
.texts{pointer-events:none}
.frame{position:absolute;left:0;top:0;overflow:hidden;opacity:0;will-change:transform,width,height,opacity}
.lay{position:absolute;inset:0;visibility:hidden}
.lz{position:absolute;inset:0;transform-origin:50% 50%}
.lz video,.lz img{width:100%;height:100%;object-fit:cover;display:block}
.scrim{position:absolute;inset:0;pointer-events:none}
.ph{position:absolute;inset:0;display:grid;place-items:center;background:var(--ph);
  background-image:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 14px)}
.ph span{font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ph-fg);text-align:center;padding:0 12px}
.ph--video::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:250% 100%;animation:sheen 6s linear infinite}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion:reduce){.ph--video::after{animation:none}}

/* text: one layer per section, positioned on a 3x3 grid */
.tr{position:absolute;inset:0;display:grid;padding:var(--top) var(--g) var(--g);visibility:hidden}
.tr[data-layout="left"]{left:50%}
.tr[data-layout="right"]{right:50%}
.tr[data-x="left"] .copy{justify-self:start}
.tr[data-x="center"] .copy{justify-self:center}
.tr[data-x="right"] .copy{justify-self:end}
.tr[data-y="top"] .copy{align-self:start}
.tr[data-y="middle"] .copy{align-self:center}
.tr[data-y="bottom"] .copy{align-self:end}
.copy{pointer-events:auto;display:grid;gap:clamp(12px,1.8cqw,22px);max-width:min(100%,var(--cw))}
.copy > *{will-change:transform,opacity}
.copy.w-narrow{--cw:440px}.copy.w-medium{--cw:720px}.copy.w-wide{--cw:1120px}
.copy[data-align="left"]{text-align:left;justify-items:start}
.copy[data-align="center"]{text-align:center;justify-items:center}
.copy[data-align="right"]{text-align:right;justify-items:end}
.eb{font:400 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.hl{font-weight:700;line-height:.94;letter-spacing:-.025em;text-wrap:balance}
.hl .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .03em .12em;margin:0 -.03em -.12em}
.hl .w > span{display:inline-block;will-change:transform}
.s-s .hl{font-size:clamp(28px,3.8cqw,56px)}
.s-m .hl{font-size:clamp(34px,5.6cqw,84px)}
.s-l .hl{font-size:clamp(40px,7.6cqw,116px)}
.s-xl .hl{font-size:clamp(46px,10.2cqw,156px)}
.hl.q{font-weight:600;line-height:1.04;letter-spacing:-.018em}
.s-xl .hl.q{font-size:clamp(38px,7cqw,108px)}
.attr{font:400 12px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bd{font:400 clamp(15px,1.25cqw,19px)/1.45 var(--sans);max-width:38ch}
.stats{display:flex;gap:clamp(20px,4cqw,56px);flex-wrap:wrap;margin-top:4px}
.stats div{display:grid;gap:6px}
.stats b{font:700 clamp(26px,3.6cqw,52px)/1 var(--sans);letter-spacing:-.02em}
.stats small{font:400 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cta{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 24px;border-radius:4px;background:var(--ink);color:var(--white);font:600 14px/1 var(--sans);text-decoration:none;margin-top:6px}

/* product card */
.cw{position:absolute;inset:0;display:grid;padding:var(--top) var(--g) var(--g);visibility:hidden}
.cw[data-x="left"] .card{justify-self:start}.cw[data-x="center"] .card{justify-self:center}.cw[data-x="right"] .card{justify-self:end}
.cw[data-y="top"] .card{align-self:start}.cw[data-y="middle"] .card{align-self:center}.cw[data-y="bottom"] .card{align-self:end}
.card{pointer-events:auto;width:min(290px,80%);background:var(--white);color:var(--ink);border:1px solid #E6E6E6;border-radius:4px;padding:10px;display:grid;grid-template-columns:60px 1fr 34px;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.08);will-change:transform,opacity}
.card .th{width:60px;height:72px;border-radius:2px;background:var(--ph);background-image:repeating-linear-gradient(135deg,var(--ph-line) 0 1px,transparent 1px 10px)}
.card p{font:600 14px/1.2 var(--sans)}
.card small{display:block;font:400 12px/1.3 var(--sans);color:var(--mute);margin-top:4px}
.card .add{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--white);font-size:18px;line-height:1}

/* phone-width preview: split text moves below the media */
@container (max-width:720px){
  .tr[data-layout="left"],.tr[data-layout="right"]{inset:50% 0 0 0;padding-top:var(--g)}
}

/* stage chrome */
.counter{position:absolute;top:18px;left:var(--g);z-index:10;font:400 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);pointer-events:none}
.dots{position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:10}
.dots button{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink);opacity:.5}
.dots button.on{background:var(--ink);opacity:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#9A9A9A;font:400 12px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:24px}

/* ================= control panel (lululemon.com style) ================= */
.fab{position:fixed;right:16px;bottom:16px;z-index:60;height:44px;padding:0 22px;border-radius:4px;background:var(--p-accent);color:var(--p-accent-fg);font:600 14px/1 var(--sans);box-shadow:0 4px 16px rgba(0,0,0,.18);transition:right .35s var(--ease-out)}
body.panel-open .fab{right:calc(var(--panel-w) + 16px)}
.panel{position:fixed;top:0;right:0;bottom:0;width:var(--panel-w);z-index:50;background:var(--p-bg);color:var(--p-fg);border-left:1px solid var(--p-line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s var(--ease-out);font:400 14px/1.45 var(--sans)}
body.panel-open .panel{transform:none}
.p-head{padding:20px 20px 16px;border-bottom:1px solid var(--p-line-2);display:grid;gap:14px}
.p-title{display:grid;gap:4px}
.p-title b{font:700 22px/1.1 var(--sans);letter-spacing:-.01em}
.p-title small{font-size:13px;color:var(--p-mute)}
.p-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p-row .seg{flex:1}
.btn{height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--p-fg);background:#fff;font:600 13px/1 var(--sans);white-space:nowrap}
.btn:hover{background:var(--p-soft)}
.btn.pri{background:var(--p-accent);color:var(--p-accent-fg)}
.btn.pri:hover{background:#333}
.btn[disabled]{opacity:.35;cursor:default}
.linkbtn{font:400 13px/1 var(--sans);text-decoration:underline;text-underline-offset:3px;color:var(--p-fg);padding:4px 0}
.linkbtn[disabled]{opacity:.35;cursor:default}
.p-list{border-bottom:1px solid var(--p-line-2);max-height:36vh;overflow:auto}
.p-list-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 10px;position:sticky;top:0;background:#fff;z-index:1}
.p-list-h b{font:600 15px/1 var(--sans)}
.lbl{font:600 13px/1.2 var(--sans);color:var(--p-fg)}
.row{display:grid;grid-template-columns:12px 38px 1fr auto;align-items:center;gap:10px;padding:10px 20px 10px 17px;cursor:pointer;border-left:3px solid transparent;border-top:1px solid var(--p-line-2)}
.row:hover{background:var(--p-soft)}
.row.is-sel{border-left-color:var(--p-fg);background:var(--p-soft)}
.row.drop-above{box-shadow:inset 0 2px 0 var(--red)}
.row.drop-below{box-shadow:inset 0 -2px 0 var(--red)}
.grip{color:#9A9A9A;cursor:grab;font-size:12px;letter-spacing:-2px;user-select:none}
.row .nm{min-width:0;display:grid;gap:3px}
.row .nm b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{font-size:12px;color:var(--p-mute);text-transform:capitalize}
.row.is-cur .nm small::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.acts{display:flex;gap:0}
.ib{width:26px;height:26px;border-radius:4px;color:var(--p-mute);font-size:14px;line-height:1}
.ib:hover:not([disabled]){background:#fff;color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-line)}
.ib[disabled]{opacity:.3;cursor:default}
.mini{position:relative;width:38px;height:24px;border-radius:2px;overflow:hidden;border:1px solid var(--p-line)}
.mini i{position:absolute;display:block}
.mini .mm{background:#9A9A9A;opacity:.45}
.mini .mt{height:3px;width:10px;background:var(--p-fg);border-radius:1px}
.p-insp{flex:1;overflow:auto;padding:0 20px 48px}
.p-insp-h{padding:16px 0 4px;display:grid;gap:2px}
.p-insp-h small{font-size:12px;color:var(--p-mute)}
.p-insp-h b{font:700 18px/1.2 var(--sans)}
/* accordions, like product-page details */
details.grp{border-bottom:1px solid var(--p-line)}
details.grp summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;cursor:pointer;font:600 15px/1.2 var(--sans)}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:"+";font:400 22px/1 var(--sans)}
details.grp[open] summary::after{content:"−"}
details.grp .gb{padding:0 0 16px}
.f{display:grid;gap:8px;margin-bottom:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],textarea,select{width:100%;background:#fff;border:1px solid var(--p-line);border-radius:4px;padding:10px 12px;color:inherit;font:400 14px/1.3 var(--sans)}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-fg)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#141414 50%),linear-gradient(135deg,#141414 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;cursor:pointer}
textarea{resize:vertical;min-height:60px}
input[type=range]{width:100%;accent-color:var(--p-fg)}
/* option chips, like the size selector */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 0 auto;min-width:44px;height:40px;padding:0 10px;border:1px solid var(--p-line);border-radius:4px;background:#fff;font:400 13px/1 var(--sans);color:var(--p-fg);white-space:nowrap}
.seg button:hover{border-color:var(--p-fg)}
.seg button[aria-pressed="true"]{border-color:var(--p-fg);box-shadow:inset 0 0 0 1px var(--p-fg);font-weight:600}
.pos{display:flex;gap:16px;align-items:center}
.g9{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:120px;aspect-ratio:16/10;padding:6px;border:1px solid var(--p-line);border-radius:4px;background:#fff}
.g9 button{border-radius:2px;display:grid;place-items:center}
.g9 button::after{content:"";width:14px;height:3px;border-radius:1px;background:#BDBDBD}
.g9 button:hover{background:var(--p-soft)}
.g9 button[aria-pressed="true"]{background:var(--p-fg)}
.g9 button[aria-pressed="true"]::after{background:#fff}
.pos small{color:var(--p-mute);font-size:13px;text-transform:capitalize}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw button[aria-pressed="true"]{outline:1px solid var(--p-fg);outline-offset:3px}
.hint{font-size:13px;color:var(--p-mute);margin:-6px 0 16px}
.none{padding:32px 0;color:var(--p-mute);text-align:center}

@media (max-width:760px){
  :root{--panel-w:100vw}
  .panel{top:auto;height:64vh;width:100%;border-left:0;border-top:1px solid var(--p-line);transform:translateY(100%)}
  body.panel-open .stage{right:0}
  body.panel-open .fab{right:16px;bottom:calc(64vh + 12px)}
  .p-list{max-height:26vh}
}
</style>
</head>
<body class="panel-open">

<main class="stage" id="stage" aria-label="Story preview"></main>
<div class="spacer" id="spacer" aria-hidden="true"></div>

<button class="fab" id="fab" aria-controls="panel" aria-expanded="true">Close editor</button>

<aside class="panel" id="panel" aria-label="Story controls">
  <div class="p-head">
    <div class="p-title"><b>Story Builder</b><small>Scroll moves one composition into the next.</small></div>
    <select id="preset" aria-label="Load a preset">
      <option value="">Start from a preset</option>
      <option value="align">Align · one class (8 sections)</option>
      <option value="lockups">Hero lockups (same hero, 6 ways)</option>
      <option value="blank">Blank · one hero</option>
    </select>
    <div class="p-row">
      <button class="btn pri" id="remix" title="Randomize layouts, keep copy">Remix layouts</button>
      <button class="btn" id="export">Export</button>
      <button class="btn" id="import">Import</button>
      <button class="linkbtn" id="undo" title="Undo (⌘Z)">Undo</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>
    <details class="grp" id="pageset" style="border-bottom:0;border-top:1px solid var(--p-line-2);margin:0 -20px -16px;padding:0 20px">
      <summary>Page settings</summary>
      <div class="gb">
        <div class="f"><span class="lbl">Scroll feel</span><div class="seg" id="magnet" role="group" aria-label="Scroll feel"></div></div>
        <div class="f"><span class="lbl">Transition length</span><div class="pos" id="trans"></div></div>
      </div>
    </details>
  </div>
  <div class="p-list">
    <div class="p-list-h">
      <b>Sections</b>
      <select id="add" aria-label="Add section" style="width:auto;height:36px;padding:0 32px 0 12px;font-size:13px;font-weight:600"></select>
    </div>
    <div id="list" role="list"></div>
  </div>
  <div class="p-insp" id="insp"></div>
</aside>

<script>
(() => {
/* ---------- helpers ---------- */
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
};
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeIn = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 4);
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clone = o => JSON.parse(JSON.stringify(o));
const merge = (a, b) => {
  for (const k in b) {
    if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) a[k] = merge(a[k] && typeof a[k] === 'object' ? a[k] : {}, b[k]);
    else a[k] = b[k];
  }
  return a;
};

const MOTIONS = {
  glide:    ['Glide',    'Frames glide and resize from the last composition into this one.'],
  rise:     ['Rise',     'Frames glide while the new imagery and copy rise into place.'],
  iris:     ['Iris',     'New imagery opens from the center of each frame as it moves.'],
  dissolve: ['Dissolve', 'The last composition fades to white, then this one fades up.'],
};
const FR = 4; // frames on stage: one per gallery tile at most

/* Every section shares one shape. "Type" only picks starting values,
   so any section can become any composition. */
const BASE = () => ({
  id: uid(), name: 'Section', motion: 'glide', dwell: 1,
  media: { kind: 'video', layout: 'full', url: '', inset: 'm', mx: 'center', count: 3, arrange: 'row' },
  text: { x: 'left', y: 'bottom', align: 'auto', width: 'medium', size: 'xl' },
  overlay: 30, eyebrow: '', headline: 'Headline', body: '',
  cta: { show: false, label: 'Shop now' },
  quote: { on: false, attr: '' },
  stats: { on: false, items: [{ v: '', l: '' }, { v: '', l: '' }, { v: '', l: '' }] },
  card: { on: false, x: 'right', y: 'bottom', name: 'Product name', price: '$XX' },
});
const make = o => merge(BASE(), clone(o));

const STARTERS = {
  hero:      { label:'Hero · full-bleed video', o:{ name:'Hero', eyebrow:'Eyebrow', headline:'A headline that opens the story', cta:{show:true,label:'Shop now'} } },
  split:     { label:'Split · media + text', o:{ name:'Split', media:{kind:'image',layout:'left'}, text:{x:'left',y:'middle',size:'m',width:'narrow'}, eyebrow:'Chapter', headline:'Half image, half story', body:'Body copy sits beside the image and carries the narrative forward.' } },
  inset:     { label:'Inset · framed media', o:{ name:'Inset', media:{kind:'image',layout:'inset',mx:'right',inset:'m'}, overlay:0, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'A framed moment', body:'Room around the image lets the type breathe.' } },
  statement: { label:'Statement · type only', o:{ name:'Statement', media:{kind:'none'}, text:{x:'center',y:'middle',size:'l',width:'wide'}, headline:'One big line that lands the idea.' } },
  gallery:   { label:'Gallery · image tiles', o:{ name:'Gallery', media:{kind:'gallery',layout:'full',count:3,arrange:'row'}, overlay:0, text:{x:'left',y:'top',size:'s',width:'medium'}, headline:'Three moments' } },
  product:   { label:'Product · image + card', o:{ name:'Product', media:{kind:'image',layout:'inset',mx:'right',inset:'l'}, overlay:0, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'The product, in the story', body:'Short product line.', card:{on:true,x:'left',y:'bottom'} } },
  quote:     { label:'Quote', o:{ name:'Quote', media:{kind:'none'}, text:{x:'center',y:'middle',size:'xl',width:'wide'}, headline:'A line from a real person.', quote:{on:true,attr:'Name, role'} } },
  stats:     { label:'Stats · numbers row', o:{ name:'Stats', media:{kind:'image',layout:'right'}, text:{x:'left',y:'middle',size:'m',width:'narrow'}, headline:'By the numbers', stats:{on:true,items:[{v:'01',l:'Detail'},{v:'02',l:'Detail'},{v:'03',l:'Detail'}]} } },
  closer:    { label:'Closer · end CTA', o:{ name:'Closer', media:{kind:'video',layout:'full'}, overlay:40, text:{x:'center',y:'middle',size:'l',width:'medium'}, headline:'Where the story ends', cta:{show:true,label:'Shop the collection'} } },
};

/* Presets are written as a sequence: each composition sets up the next move. */
const PRESETS = {
  align: () => [
    make({ name:'Arrival', media:{kind:'video',layout:'full'}, text:{x:'left',y:'bottom',size:'xl'}, overlay:34,
      eyebrow:'00:00 · Arrival', headline:'Feel nothing but the practice.', body:'One class, start to finish, in the Align pant.', cta:{show:true,label:'Shop Align'} }),

      h('div', { class:'acts' },
        h('button', { class:'ib', title:'Move up', 'aria-label':'Move up', disabled: i === 0 ? true : null, onclick:act(() => move(i, i - 1)) }, '↑'),
        h('button', { class:'ib', title:'Move down', 'aria-label':'Move down', disabled: i === S.sections.length - 1 ? true : null, onclick:act(() => move(i, i + 1)) }, '↓'),
        h('button', { class:'ib', title:'Duplicate', 'aria-label':'Duplicate', onclick:act(() => { const c = clone(s); c.id = uid(); c.name += ' copy'; S.sections.splice(i + 1, 0, c); sel = c.id; }) }, '⧉'),
        h('button', { class:'ib', title:'Delete', 'aria-label':'Delete', onclick:act(() => { S.sections.splice(i, 1); if (sel === s.id) sel = (S.sections[i] || S.sections[i - 1] || {}).id; }) }, '×'),
      ));
    row.addEventListener('dragstart', e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); });
    row.addEventListener('dragover', e => {
      e.preventDefault(); const b = row.getBoundingClientRect(), below = e.clientY > b.top + b.height / 2;
      row.classList.toggle('drop-below', below); row.classList.toggle('drop-above', !below);
    });
    row.addEventListener('dragleave', () => row.classList.remove('drop-above', 'drop-below'));
    row.addEventListener('drop', e => {
      e.preventDefault(); const below = row.classList.contains('drop-below'); row.classList.remove('drop-above', 'drop-below');
      if (dragFrom < 0) return; let to = i + (below ? 1 : 0); if (dragFrom < to) to--;
      if (to !== dragFrom) { snapshot(); move(dragFrom, to); render(); }
      dragFrom = -1;
    });
    return row;
  }));
}
function move(from, to) { const [s] = S.sections.splice(from, 1); S.sections.splice(to, 0, s); }
function select(id, scroll) {
  sel = id; renderList(); renderInspector();
  if (scroll) goTo(idx(id));
}

/* ---------- inspector ---------- */
function renderInspector() {
  const keepScroll = $insp.scrollTop;
  const s = cur();
  if (!s) { $insp.replaceChildren(h('p', { class:'none' }, 'Select or add a section.')); return; }
  const m = s.media, t = s.text, i = idx(s.id);
  const up = fn => act(v => fn(v));

  const textGrp = grp('Text position',
    field('Position', grid9(t.x, t.y, act((x, y) => { t.x = x; t.y = y; }))),
    h('p', { class:'hint' }, m.kind !== 'none' && (m.layout === 'left' || m.layout === 'right') ? 'In a split, text moves within the text half.' : 'Text sits over the whole stage.'),
    field('Alignment', seg([['auto','Auto'],['left','Left'],['center','Center'],['right','Right']], t.align, up(v => t.align = v))),
    field('Headline size', seg([['s','S'],['m','M'],['l','L'],['xl','XL']], t.size, up(v => t.size = v))),
    field('Text width', seg([['narrow','Narrow'],['medium','Medium'],['wide','Wide']], t.width, up(v => t.width = v))),
  );

  const mediaGrp = grp('Media',
    field('Kind', seg([['video','Video'],['image','Image'],['gallery','Gallery'],['none','None']], m.kind, up(v => m.kind = v))));
  const mg = mediaGrp.lastChild;
  if (m.kind !== 'none') {
    mg.append(field('Placement', seg([['full','Full'],['left','Left'],['right','Right'],['inset','Inset']], m.layout, up(v => m.layout = v))));
    if (m.layout === 'inset') mg.append(h('div', { class:'f2' },
      field('Inset size', seg([['s','S'],['m','M'],['l','L']], m.inset, up(v => m.inset = v))),
      field('Inset side', seg([['left','L'],['center','C'],['right','R']], m.mx, up(v => m.mx = v)))));
    if (m.kind === 'gallery') mg.append(h('div', { class:'f2' },
      field('Tiles', seg([[2,'2'],[3,'3'],[4,'4']], m.count, up(v => m.count = v))),
      field('Arrangement', seg([['row','Row'],['stagger','Stagger'],['mosaic','Mosaic']], m.arrange, up(v => m.arrange = v)))));
    else {
      mg.append(field(`${m.kind === 'video' ? 'Video' : 'Image'} URL (blank = placeholder)`, text(m.url, v => m.url = v)));
      if (m.layout === 'full' || m.layout === 'inset')
        mg.append(field('White wash behind text', slider(0, 80, 1, s.overlay, v => v + '%', v => s.overlay = v, renderStage)));
    }
  }

  const contentGrp = grp('Copy',
    field('Section name (panel only)', text(s.name, v => s.name = v)),
    field('Eyebrow', text(s.eyebrow, v => s.eyebrow = v)),
    field('Headline', text(s.headline, v => s.headline = v, true)),
    field('Body', text(s.body, v => s.body = v, true)),
    h('div', { class:'f2' },
      field('Button', seg([[false,'Off'],[true,'On']], s.cta.show, up(v => s.cta.show = v))),
      s.cta.show ? field('Button label', text(s.cta.label, v => s.cta.label = v)) : h('span')),
  );

  const modGrp = grp('Modules',
    field('Quote style', seg([[false,'Off'],[true,'On']], s.quote.on, up(v => s.quote.on = v))));
  const md = modGrp.lastChild;
  if (s.quote.on) md.append(field('Attribution', text(s.quote.attr, v => s.quote.attr = v)));
  md.append(field('Stats row', seg([[false,'Off'],[true,'On']], s.stats.on, up(v => s.stats.on = v))));
  if (s.stats.on) s.stats.items.forEach((it, k) => md.append(h('div', { class:'f2' },
    field(`Stat ${k + 1}`, text(it.v, v => it.v = v)), field('Label', text(it.l, v => it.l = v)))));
  md.append(field('Product card', seg([[false,'Off'],[true,'On']], s.card.on, up(v => s.card.on = v))));
  if (s.card.on) md.append(
    field('Card position', grid9(s.card.x, s.card.y, act((x, y) => { s.card.x = x; s.card.y = y; }))),
    h('div', { class:'f2' }, field('Product', text(s.card.name, v => s.card.name = v)), field('Price', text(s.card.price, v => s.card.price = v))));

  const holdF = field('Hold length', slider(.4, 3, .1, s.dwell, v => v.toFixed(1) + ' screens', v => s.dwell = v, () => { measure(); update(); }));
  const motionGrp = grp('Motion in',
    i === 0 ? h('p', { class:'hint', style:{ margin:'0 0 16px' } }, 'The first section is where the story opens, so it has no motion in.') : h('div', {},
      field('How this composition arrives', seg(Object.entries(MOTIONS).map(([k, v]) => [k, v[0]]), s.motion, up(v => s.motion = v))),
      h('p', { class:'hint' }, MOTIONS[s.motion][1])),
    holdF,
  );

  const head = h('div', { class:'p-insp-h' }, h('small', {}, `Section ${i + 1} of ${S.sections.length}`), h('b', {}, s.name));
  $insp.replaceChildren(head, textGrp, mediaGrp, motionGrp, contentGrp, modGrp);
  $insp.scrollTop = keepScroll;
}

/* ---------- global controls ---------- */
function renderGlobals() {
  $('magnet').replaceChildren(...seg([[true,'Magnet'],[false,'Free']], S.magnet, act(v => S.magnet = v)).childNodes);
  $('trans').replaceChildren(...slider(.5, 2, .1, S.trans, v => v.toFixed(1) + ' screens', v => S.trans = v, () => { measure(); update(); }).childNodes);
  document.documentElement.classList.toggle('magnet', S.magnet);
}
function render() { renderGlobals(); renderStage(); renderList(); renderInspector(); save(); }

$('add').replaceChildren(h('option', { value:'' }, '+ Add section'),
  ...Object.entries(STARTERS).map(([k, v]) => h('option', { value:k }, v.label)));
$('add').addEventListener('change', e => {
  const k = e.target.value; e.target.value = ''; if (!k) return;
  snapshot(); const s = make(STARTERS[k].o), at = sel ? idx(sel) + 1 : S.sections.length;
  S.sections.splice(at, 0, s); sel = s.id; render(); goTo(at);
});
$('preset').addEventListener('change', e => {
  const k = e.target.value; e.target.value = ''; if (!k) return;
  snapshot(); S.sections = PRESETS[k](); sel = S.sections[0].id; render(); scrollTo(0, 0);
});
$('remix').addEventListener('click', act(() => {
  S.sections.forEach((s, i) => {
    if (s.media.kind !== 'none') s.media.layout = pick(i === 0 ? ['full','full','right','left'] : ['full','left','right','inset','inset']);
    s.media.mx = pick(['left','center','right']); s.media.inset = pick(['m','l']);
    s.text.x = pick(['left','center','right']); s.text.y = pick(['top','middle','bottom']); s.text.align = 'auto';
    if (s.card.on) { s.card.x = pick(['left','right']); s.card.y = pick(['top','bottom']); }
    if (i) s.motion = pick(['glide','glide','rise','iris','dissolve']);
  });
}));
$undo.addEventListener('click', undo);
$('export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
  const a = h('a', { href:URL.createObjectURL(blob), download:'story-layout.json' }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('import').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const d = normalize(JSON.parse(await f.text())); if (!d.sections.length) throw 0; snapshot(); S = d; sel = S.sections[0].id; render(); }
  catch (err) { alert('That file is not a Story Builder layout.'); }
});

const $fab = $('fab');
function togglePanel(force) {
  const open = document.body.classList.toggle('panel-open', force);
  $fab.textContent = open ? 'Close editor' : 'Edit story'; $fab.setAttribute('aria-expanded', String(open));
  setTimeout(() => { measure(); update(); }, 380);
}
$fab.addEventListener('click', () => togglePanel());
addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); }
  else if (!typing && e.key.toLowerCase() === 'e' && !e.metaKey && !e.ctrlKey) togglePanel();
});

render();
})();
</script>
</body>
</html>
