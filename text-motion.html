<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Motion Studio</title>
<style>
@font-face{font-family:"Saans";src:url("lululemon-saans-regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Saans";src:url("lululemon-saans-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Saans Mono";src:url("saans-mono-regular.woff2") format("woff2");font-weight:400;font-display:swap}

/* Layout: three working columns. Controls left, live stage + variants centre, developer handoff right.
   Below 1280px the handoff drops under the stage; below 820px everything stacks with the stage pinned on top. */
:root{
  --bg:#f2f1f0; --panel:#fdfdf9; --raise:#ffffff; --fg:#1c1210; --muted:#5e504b; --faint:#94877e;
  --line:#d2cdc4; --soft:#e9e7e1; --accent:#ff444c; --accent-ink:#b8302e; --sel:#1c1210; --sel-fg:#fdfdf9;
  --sans:"Saans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"Saans Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110d0c; --panel:#1a1513; --raise:#241e1b; --fg:#f2f1f0; --muted:#c9c0b6; --faint:#8d8077;
    --line:#3b3330; --soft:#2a2320; --accent:#ff444c; --accent-ink:#ff8a8f; --sel:#f2f1f0; --sel-fg:#1c1210; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110d0c; --panel:#1a1513; --raise:#241e1b; --fg:#f2f1f0; --muted:#c9c0b6; --faint:#8d8077;
  --line:#3b3330; --soft:#2a2320; --accent:#ff444c; --accent-ink:#ff8a8f; --sel:#f2f1f0; --sel-fg:#1c1210; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:10px 16px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top .back{color:var(--muted);text-decoration:none;font-size:13px}
.top .back:hover{color:var(--fg)}
.top h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.top .tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted)}
.top .spacer{flex:1}
.top .hist{display:inline-flex;gap:6px}
@media (max-width:560px){ .top .spacer{flex-basis:100%;height:0} }
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:5px;background:var(--raise);font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.btn.icon{padding:6px 8px}
.btn svg{width:15px;height:15px;flex:none}
.kbd{font-family:var(--mono);font-size:10px;color:var(--faint)}

/* ---------- app grid ---------- */
.app{flex:1;min-height:0;display:grid;grid-template-columns:350px minmax(0,1fr) 440px}
.side,.main,.handoff{overflow:auto;min-width:0}
.side{border-right:1px solid var(--line);background:var(--panel)}
.handoff{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.main{padding:16px;display:flex;flex-direction:column;gap:18px}
.main > *{flex-shrink:0}
@media (max-width:1280px){
  html,body{height:auto} body{display:block}
  .app{grid-template-columns:330px minmax(0,1fr)}
  .side{grid-row:1 / 3;position:sticky;top:0;max-height:100vh;align-self:start}
  .main,.handoff{overflow:visible}
  .handoff{grid-column:2;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .app{display:flex;flex-direction:column}
  .side{position:static;max-height:none;order:2;border-right:0;border-top:1px solid var(--line)}
  .main{order:1;padding-inline:16px}
  .handoff{order:3}
  .stagecard{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .stage{min-height:150px;max-height:34vh}
  .stage-inner{padding:20px 16px}
  .legend,.trig-note{display:none}
}

/* ---------- side: effect picker ---------- */
.side-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.side-sec > .eyebrow{display:block;margin-bottom:8px}
.fx-group + .fx-group{margin-top:10px}
.fx-group .eyebrow{display:block;margin-bottom:6px;font-size:10px;color:var(--faint)}
.fx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fx-tile{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raise);overflow:hidden;text-align:left}
.fx-tile .mini{height:40px;display:grid;place-items:center;background:#e6e4e1;font-size:20px;color:#1a1a1a;overflow:hidden}
.fx-tile .nm{padding:5px 7px;font-size:12px;font-weight:600;line-height:1.2}
.fx-tile[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.fx-desc{margin-top:10px;color:var(--muted);font-size:13px}

/* ---------- side: control groups ---------- */
.grp{border-bottom:1px solid var(--line)}
.grp > summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;cursor:pointer;user-select:none}
.grp > summary::-webkit-details-marker{display:none}
.grp > summary .eyebrow{flex:1;color:var(--fg)}
.grp > summary .chev{width:10px;height:10px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-top:-4px}
.grp:not([open]) > summary .chev{transform:rotate(-45deg);margin-top:0}
.grp > summary .count{font-family:var(--mono);font-size:10px;color:var(--accent-ink)}
.grp-body{display:flex;flex-direction:column;gap:16px;padding:2px 16px 18px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl-head{display:flex;align-items:center;gap:6px;min-height:26px}
.ctl-head .lab{flex:1;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;min-width:0}
.ctl.changed .ctl-head .lab::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.scrub{cursor:ew-resize;user-select:none;touch-action:none}
.reset{border:0;background:none;padding:3px;border-radius:4px;color:var(--muted);display:inline-grid;place-items:center;visibility:hidden}
.reset svg{width:14px;height:14px}
.reset:hover{color:var(--fg);background:var(--soft)}
.ctl.changed .reset{visibility:visible}
.hint{font-size:12px;color:var(--muted);line-height:1.35}
.num{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;background:var(--raise);height:26px;padding-right:7px}
.num:focus-within{border-color:var(--fg)}
.num input{width:62px;border:0;background:none;padding:0 4px 0 8px;font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num input:focus{outline:none}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num .unit{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:1ch}
/* slider */
.track{position:relative;height:22px;display:flex;align-items:center}
.track .def{position:absolute;top:17px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--faint);left:calc(8px + (100% - 16px) * var(--d,0));pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--fg) 0 calc(var(--p,0) * 100%),var(--line) calc(var(--p,0) * 100%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--raise);border:2px solid var(--fg);margin-top:-6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--raise);border:2px solid var(--fg)}
input[type=range]:focus{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--soft);border-radius:6px}
.seg button{flex:1 1 auto;padding:5px 8px;border:0;border-radius:4px;background:none;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* toggle */
.ctl-toggle .ctl-head{cursor:pointer}
.switch{position:relative;width:34px;height:20px;border-radius:10px;border:0;background:var(--line);flex:none;padding:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--raise);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--fg)}
.switch[aria-checked="true"]::after{transform:translateX(14px)}
/* color */
.colorrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.swatch{position:relative;width:30px;height:26px;border-radius:5px;border:1px solid var(--line);overflow:hidden;flex:none;cursor:pointer;background:var(--c)}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.hex{width:84px;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0 8px;font-family:var(--mono);font-size:12px;text-transform:lowercase}
.hex:focus{outline:none;border-color:var(--fg)}
.hex.bad{border-color:var(--accent)}
.pal{display:flex;gap:4px;flex-wrap:wrap}
.pal button{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.18);padding:0;background:var(--c)}
.pal button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--fg)}
.cname{font-size:12px;color:var(--muted)}
/* ease */
.ease-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ease-chip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--raise);font-size:10px;font-weight:600;line-height:1.1;color:var(--muted)}
.ease-chip svg{width:30px;height:22px;overflow:visible}
.ease-chip path{fill:none;stroke:currentColor;stroke-width:1.6}
.ease-chip[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.ease-edit{border:1px solid var(--line);border-radius:6px;background:var(--raise);padding:8px}
.ease-edit > summary{cursor:pointer;font-size:12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.ease-edit > summary::-webkit-details-marker{display:none}
.ease-edit > summary .mono{color:var(--muted);font-weight:400;font-size:11px}
.bez{display:block;width:100%;max-width:240px;margin:8px auto 4px;touch-action:none}
.bez .box{fill:none;stroke:var(--line)}
.bez .diag{stroke:var(--line);stroke-dasharray:3 3}
.bez .curve{fill:none;stroke:var(--fg);stroke-width:2.5}
.bez .arm{stroke:var(--accent);stroke-width:1.5}
.bez .h{fill:var(--raise);stroke:var(--accent);stroke-width:2;cursor:grab}
.bez .hit{fill:transparent;cursor:grab}
.bez text{font-family:var(--mono);font-size:9px;fill:var(--faint)}
.bez-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.bez-nums .num{padding-right:4px}
.bez-nums .num input{width:100%;padding-left:4px}
.ease-demo{position:relative;height:14px;margin-top:8px;border-radius:7px;background:var(--soft)}
.ease-demo i{position:absolute;top:2px;left:0;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.type-note{font-size:12px;color:var(--muted)}

/* ---------- stage ---------- */
.stagecard{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.toolbar .field{display:flex;align-items:center;gap:6px;flex:1 1 220px;min-width:0}
.toolbar .field input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0 9px}
.toolbar .field input:focus{outline:none;border-color:var(--fg)}
.toolbar .seg{flex:none}
.stage{position:relative;min-height:240px;max-height:56vh;overflow:auto;display:grid;place-items:center;transition:background .2s}
.stage[data-ctx="nav"]{background:linear-gradient(160deg,#2a2b2d 0%,#56585b 55%,#36373a 100%)}
.stage[data-ctx="light"]{background:#fdfdf9}
.stage[data-ctx="dark"]{background:#141414}
.stage[data-ctx="red"]{background:#ff444c}
.stage[data-ctx="burn"]{background:#9c413c}
.stage-inner{padding:40px 24px;width:100%;display:grid;place-items:center}
.navbar{display:flex;align-items:center;gap:28px;color:#1a1a1a;width:min(100%,940px);min-width:0}
.stage[data-ctx="nav"] .navbar{background:#e6e4e1;border-radius:6px;padding:0 22px;height:3.9em;box-shadow:0 8px 30px rgba(0,0,0,.25);overflow:hidden}
.navbar .logo{width:1.7em;height:1.7em;border-radius:50%;background:#1a1a1a;flex:none}
.navlinks{display:flex;align-items:center;gap:1.9em;min-width:0;white-space:nowrap}
.stage:not([data-ctx="nav"]) .navbar{justify-content:center}
.stage:not([data-ctx="nav"]) .logo,.stage:not([data-ctx="nav"]) .navlinks > :not(.host){display:none}
.host{display:inline-block;outline-offset:6px;border-radius:2px}
.tm-label{display:inline-block;position:relative}
.tm-label .ch{display:inline-block;white-space:pre}
.tm-label .ch.is-scrambling{color:var(--scr)}
/* player */
.player{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;flex:none}
.pbtn svg{width:14px;height:14px}
.pbtn.go{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.scrubber{position:relative;flex:1 1 240px;min-width:160px;height:34px}
.segs{position:absolute;left:0;right:0;top:9px;height:16px;border-radius:4px;overflow:hidden;background:var(--soft)}
.segs .sg{position:absolute;top:0;bottom:0}
.segs .sg.delay{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)}
.segs .sg.motion{background:color-mix(in srgb,var(--accent) 28%,transparent)}
.segs .sg.pause{background:transparent}
.segs .tk{position:absolute;top:3px;bottom:3px;width:1px;background:color-mix(in srgb,var(--accent) 70%,transparent)}
.playhead{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px;pointer-events:none}
.scrubber input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.time{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:118px;text-align:right}
.speed select{height:30px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0 6px;font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 12px 10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.trig-note{font-size:12px;color:var(--muted);padding:0 12px 10px}
.trig-note:empty{display:none}
.simhover[aria-pressed="true"]{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}

/* ---------- variants ---------- */
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.vhead h2{font-size:15px;margin-right:auto}
.save{display:flex;gap:6px;align-items:center}
.save input{height:30px;width:170px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0 9px;font-size:13px}
.save input:focus{outline:none;border-color:var(--fg)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vgroup{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;margin-top:8px}
.vgroup:first-child{margin-top:0}
.vgroup h3{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400}
.card{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--panel);overflow:hidden;text-align:left;min-width:0}
.card:hover{border-color:var(--faint)}
.card[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.card .sw{height:66px;display:grid;place-items:center;font-size:17px;color:#1a1a1a;overflow:hidden;padding:0 10px}
.sw[data-ctx="nav"]{background:#e6e4e1}.sw[data-ctx="light"]{background:#fdfdf9}.sw[data-ctx="dark"]{background:#141414}.sw[data-ctx="red"]{background:#ff444c}.sw[data-ctx="burn"]{background:#9c413c}
.card .meta{padding:9px 11px 10px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line)}
.card .meta b{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.card .meta span{font-size:12px;color:var(--muted);line-height:1.35}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted);font-weight:400}
.card .del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px;padding:0;display:none}
.card:hover .del,.card:focus-within .del{display:block}
.empty{grid-column:1/-1;padding:24px;border:1px dashed var(--line);border-radius:7px;color:var(--muted);text-align:center}

/* ---------- handoff ---------- */
.ho-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ho-head h2{font-size:15px}
.ho-head p{font-size:12px;color:var(--muted)}
.clsrow{display:flex;align-items:center;gap:8px}
.clsrow label{font-size:12px;font-weight:600;white-space:nowrap}
.clsrow input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0 8px;font-family:var(--mono);font-size:12px}
.clsrow input:focus{outline:none;border-color:var(--fg)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 10px 9px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.ho-actions{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.ho-body{padding:12px 16px 24px;flex:1}
pre.code{margin:0;padding:12px;background:var(--raise);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow-x:auto;white-space:pre;tab-size:2}
pre.code .cm{color:var(--faint)}
.spec{width:100%;border-collapse:collapse;font-size:13px}
.spec th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:14px 0 6px;border-bottom:1px solid var(--line)}
.spec tr:first-child th{padding-top:0}

.spec td:first-child{color:var(--muted);width:42%;padding-right:12px}

.spec .chip{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);display:inline-block;flex:none}

.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){ .switch,.switch::after,.toast,.grp > summary .chev{transition:none} }

<body>

<header class="top">
  <a class="back" href="tools.html">← Hub tools</a>
  <h1>Text Motion Studio</h1>
  <span class="tag">beta</span>
  <span class="spacer"></span>
  <span class="hist">
  <button class="btn icon" id="undo" type="button" title="Undo (⌘Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H7"/></svg></button>
  <button class="btn icon" id="redo" type="button" title="Redo (⇧⌘Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H9"/></svg></button>
  </span>
  <button class="btn" id="resetAll" type="button" title="Put every control for this effect back to its default">Reset effect</button>
  <button class="btn primary" id="share" type="button">Copy share link</button>
</header>

<div class="app">
  <aside class="side" aria-label="Controls">
    <section class="side-sec">
      <span class="eyebrow">Effect</span>
      <div id="fxPick"></div>
      <p class="fx-desc" id="fxDesc"></p>

    <div id="controls"></div>
  </aside>

  <main class="main">
    <section class="stagecard" aria-label="Preview">

        <button class="pbtn" id="restart" type="button" aria-label="Restart" title="Restart"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v3h3"/></svg></button>
        <div class="scrubber">

  <aside class="handoff" aria-label="Developer handoff">

      <div class="clsrow"><label for="clsName">Class name</label><input id="clsName" type="text" spellcheck="false" autocomplete="off"></div>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="ho-actions">
      <button class="btn" id="copyTab" type="button">Copy</button>
      <button class="btn" id="copyAll" type="button">Copy full handoff</button>
    </div>
    <div class="ho-body" id="hoBody"></div>
  </aside>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const H = '#ff444c', SB = '#9c413c', INK = '#1a1a1a';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const hexOk = h => /^#[0-9a-f]{6}$/i.test(h);
function hexToRgb(h){ h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgbToHex = a => '#' + a.map(x => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((x, i) => x + (B[i] - x) * t)); };
const rgba = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r}, ${g}, ${b}, ${+a.toFixed(3)})`; };
const r2 = x => +(+x).toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kebab = k => { const s = k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()); return s.startsWith('webkit-') ? '-' + s : s; };
function applyStyle(e, o){ for (const [k, v] of Object.entries(o || {})) if (v != null) e.style.setProperty(kebab(k), String(v)); }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } })();
const ICON_RESET = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9"/><path d="M2.5 2.5v3h3"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>';

/* ================= easing ================= */
const EASES = [
  ['linear', 'Linear', [0, 0, 1, 1]],
  ['ease', 'Ease', [.25, .1, .25, 1]],
  ['ease-in', 'Ease in', [.42, 0, 1, 1]],
  ['ease-out', 'Ease out', [0, 0, .58, 1]],
  ['ease-in-out', 'In-out', [.42, 0, .58, 1]],
  ['standard', 'Standard', [.4, 0, .2, 1]],
  ['strong', 'Strong', [.65, 0, .35, 1]],
  ['snappy', 'Snappy', [.7, 0, .3, 1]],
  ['glide', 'Glide', [.2, .8, .2, 1]],
  ['expo-out', 'Expo out', [.16, 1, .3, 1]],
  ['anticipate', 'Anticipate', [.6, -.28, .74, .05]],
  ['overshoot', 'Overshoot', [.34, 1.56, .64, 1]],
];
const E = Object.fromEntries(EASES.map(e => [e[0], e[2]]));
const KEYWORD_EASE = new Set(['linear', 'ease', 'ease-in', 'ease-out', 'ease-in-out']);
const easeMatch = a => EASES.find(e => e[2].every((v, i) => Math.abs(v - a[i]) < 1e-4)) || null;
function easeCSS(a){ const m = easeMatch(a); if (m && KEYWORD_EASE.has(m[0])) return m[0]; return `cubic-bezier(${a.map(v => +(+v).toFixed(3)).join(', ')})`; }
const easeLabel = a => { const m = easeMatch(a); return m ? m[1] : 'Custom'; };
/* The time-reversed curve. Exits use it so an exit looks like the entrance played backwards. */
const mirror = a => [1 - a[2], 1 - a[3], 1 - a[0], 1 - a[1]].map(v => r2(v));
function easePath(a, w, h, pad){
  const X = x => pad + x * (w - 2 * pad), Y = y => h - pad - y * (h - 2 * pad);
  return `M${X(0)} ${Y(0)} C${X(a[0])} ${Y(a[1])} ${X(a[2])} ${Y(a[3])} ${X(1)} ${Y(1)}`;
}

/* ================= palette + fonts ================= */
const PALETTE = [['Hot Heat', H], ['Slow Burn', SB], ['Coral', '#ff5f57'], ['Peach', '#feb899'], ['Black', INK], ['Ink', '#1c1210'], ['Mocha', '#94877e'], ['Fog', '#e9e7e1'], ['White', '#ffffff']];
const colorName = h => { const m = PALETTE.find(p => p[1].toLowerCase() === String(h).toLowerCase()); return m ? m[0] : null; };
const FONTS = [
  ['saans', 'Saans', '"Saans", system-ui, sans-serif'],
  ['system', 'System', 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'],
  ['helvetica', 'Helvetica', '"Helvetica Neue", Helvetica, Arial, sans-serif'],
  ['serif', 'Serif', 'Georgia, "Times New Roman", serif'],
  ['mono', 'Mono', '"Saans Mono", ui-monospace, Menlo, monospace'],
];
const CONTEXTS = [['nav', 'Nav bar'], ['light', 'Light'], ['dark', 'Dark'], ['red', 'Hot Heat'], ['burn', 'Slow Burn']];

/* ================= shared timing controls ================= */
const TRIG = [['loop', 'Loop'], ['once', 'Once'], ['hover', 'Hover'], ['hover-loop', 'Hover loop']];
const TRIG_TEXT = {
  'loop': 'Loops continuously.',
  'once': 'Plays once when the page loads, then holds the last frame.',
  'hover': 'Plays once on hover or keyboard focus. Resets when the pointer leaves.',
  'hover-loop': 'Loops while hovered or focused. Resets when the pointer leaves.',
};
const isLoop = p => p.trigger === 'loop' || p.trigger === 'hover-loop';
const isHover = p => p.trigger === 'hover' || p.trigger === 'hover-loop';
function timing(o = {}){
  const c = [{k: 'trigger', t: 'seg', label: 'Plays', options: TRIG, hint: p => TRIG_TEXT[p.trigger]}];
  if (o.dir) c.push({k: 'dir', t: 'seg', label: 'Direction', options: o.dir});
  if (o.dur !== false) c.push({k: 'dur', t: 'range', label: o.durLabel || 'Duration', hint: o.durHint || 'How long one pass of the motion takes.', min: o.durMin || 100, max: o.durMax || 6000, step: o.durStep || 50, unit: 'ms'});
  if (o.stagger) c.push({k: 'stagger', t: 'range', label: o.staggerLabel || 'Letter stagger', hint: o.staggerHint || 'Time between one letter starting and the next.', min: o.staggerMin ?? 0, max: 300, step: 5, unit: 'ms'});
  if (o.hold) c.push({k: 'hold', t: 'range', label: 'Hold', hint: o.holdHint || 'How long the finished state stays before it exits.', min: 0, max: 6000, step: 50, unit: 'ms', show: o.holdShow});
  c.push({k: 'pause', t: 'range', label: 'Pause between loops', hint: 'Rest time after a pass ends and before the next one starts.', min: 0, max: 10000, step: 100, unit: 'ms', show: isLoop});
  c.push({k: 'delay', t: 'range', label: 'Start delay', hint: 'Wait before the very first pass.', min: 0, max: 3000, step: 50, unit: 'ms'});
  if (o.ease !== false) c.push({k: 'ease', t: 'ease', label: 'Easing', hint: o.easeHint || 'The speed curve of each movement. Exits use the same curve played backwards.'});
  return {title: 'Timing', controls: c};
}
const BG_CLIP = (img, size = '300% 100%', repeat = 'no-repeat') => ({
  backgroundImage: img, backgroundSize: size, backgroundRepeat: repeat,
  webkitBackgroundClip: 'text', backgroundClip: 'text', webkitTextFillColor: 'transparent', color: 'transparent',
});
const lastPad = frames => { const l = frames[frames.length - 1]; if (l.offset < 1){ const {easing, ...rest} = l; frames.push({...rest, offset: 1}); } return frames; };

/* ================= effects ================= */
function shimmerBand(p, at, strength){
  const w = p.width / 3, pl = w * (1 - p.soft / 100);
  const hi = mix(p.base, p.hi, p.peak / 100 * strength);
  const a = at - w / 2, b = at - pl / 2, c = at + pl / 2, d = at + w / 2;
  const out = [[a, p.base]];
  if (p.tintOn){ const t = mix(p.base, p.tint, .85 * strength); out.push([a + (b - a) * .5, t], [b, hi], [c, hi], [c + (d - c) * .5, t]); }
  else out.push([b, hi], [c, hi]);
  out.push([d, p.base]);
  return out;
}
function shimmerGradient(p){
  let stops = shimmerBand(p, 50, 1);
  if (p.echoOn){ const off = p.width / 3 * 1.15 * (p.dir === 'ltr' ? -1 : 1); stops = stops.concat(shimmerBand(p, 50 + off, p.echo / 100)).sort((x, y) => x[0] - y[0]); }
  const list = [`${p.base} 0%`, ...stops.map(([pos, col]) => `${col} ${clamp(pos, 0, 100).toFixed(2)}%`), `${p.base} 100%`];
  return `linear-gradient(${p.angle}deg, ${list.join(', ')})`;
}

const FX = {
  shimmer: {
    name: 'Shimmer', kind: 'label',
    desc: 'A band of light travels across the label. This is the effect on the shop nav today.',
    reduced: 'Animation off. The label shows in its text color.',
    defaults: {base: INK, hi: '#ffffff', peak: 100, tintOn: false, tint: H, width: 36, soft: 100, angle: 90, echoOn: false, echo: 45,
      trigger: 'loop', dir: 'rtl', dur: 1500, pause: 2000, delay: 0, ease: E['ease-in-out']},
    groups: [
      {title: 'Color', controls: [
        {k: 'base', t: 'color', label: 'Text color', hint: 'The label color outside the band.'},
        {k: 'hi', t: 'color', label: 'Band color', hint: 'The color at the centre of the band.'},
        {k: 'peak', t: 'range', label: 'Band strength', hint: 'How far the band moves from the text color toward the band color.', min: 0, max: 100, step: 1, unit: '%'},
        {k: 'tintOn', t: 'toggle', label: 'Tint the band edges'},
        {k: 'tint', t: 'color', label: 'Edge tint', show: p => p.tintOn},
      ]},
      {title: 'Band', controls: [
        {k: 'width', t: 'range', label: 'Band width', hint: 'Width of the band compared to the label.', min: 5, max: 150, step: 1, unit: '%'},
        {k: 'soft', t: 'range', label: 'Edge softness', hint: '0 is a crisp edge. 100 is a long smooth ramp.', min: 0, max: 100, step: 1, unit: '%'},
        {k: 'angle', t: 'range', label: 'Angle', hint: '90° is upright. Tilt it for a slanted sheen.', min: 45, max: 135, step: 1, unit: '°'},
        {k: 'echoOn', t: 'toggle', label: 'Trailing echo band', hint: 'A fainter second band follows the first.'},
        {k: 'echo', t: 'range', label: 'Echo strength', min: 0, max: 100, step: 1, unit: '%', show: p => p.echoOn},
      ]},
      timing({dir: [['rtl', 'Right to left'], ['ltr', 'Left to right'], ['bounce', 'Bounce']], durLabel: 'Sweep duration', durHint: 'Time for the band to cross the label once.'}),
    ],
    compile(p){
      const pos = {rtl: ['0% 0', '100% 0'], ltr: ['100% 0', '0% 0'], bounce: ['0% 0', '100% 0']}[p.dir];
      const ez = easeCSS(p.ease);
      let frames, active;
      if (p.dir === 'bounce'){ active = p.dur * 2; frames = [{offset: 0, backgroundPosition: pos[0], easing: ez}, {offset: .5, backgroundPosition: pos[1], easing: easeCSS(mirror(p.ease))}, {offset: 1, backgroundPosition: pos[0]}]; }
      else { active = p.dur; frames = [{offset: 0, backgroundPosition: pos[0], easing: ez}, {offset: 1, backgroundPosition: pos[1]}]; }
      return {active, labelStyle: {...BG_CLIP(shimmerGradient(p)), backgroundPosition: pos[0]}, tracks: [{target: 'label', frames}]};
    },
  },

  fill: {
    name: 'Fill wipe', kind: 'label',
    desc: 'A new color wipes through the label, holds, then wipes back out.',
    reduced: 'Animation off. Looping labels stay in the starting color. Hover labels switch straight to the fill color.',
    defaults: {from: INK, to: H, soft: 30, mode: 'inout', trigger: 'loop', dir: 'ltr', dur: 700, hold: 900, pause: 1500, delay: 0, ease: E.strong},
    groups: [
      {title: 'Color', controls: [
        {k: 'from', t: 'color', label: 'Starting color'},
        {k: 'to', t: 'color', label: 'Fill color'},
      ]},
      {title: 'Wipe', controls: [
        {k: 'soft', t: 'range', label: 'Edge softness', hint: '0 is a hard edge. 100 blends across the whole label.', min: 0, max: 100, step: 1, unit: '%'},
        {k: 'mode', t: 'seg', label: 'Shape', options: [['inout', 'Fill, then empty'], ['in', 'Fill only']], hint: p => p.mode === 'in' ? 'Fills and stays. When looping it snaps back before the next pass.' : 'Fills, holds, then reverses out the way it came.'},
      ]},
      timing({dir: [['ltr', 'Left to right'], ['rtl', 'Right to left']], hold: true, holdHint: 'How long the label stays filled.', durLabel: 'Wipe duration'}),
    ],
    compile(p){
      const e = p.soft / 100 * 33, a = (50 - e / 2).toFixed(2), b = (50 + e / 2).toFixed(2);
      const L = p.dir === 'ltr' ? [p.to, p.from] : [p.from, p.to];
      const g = `linear-gradient(90deg, ${L[0]} 0%, ${L[0]} ${a}%, ${L[1]} ${b}%, ${L[1]} 100%)`;
      const start = p.dir === 'ltr' ? '100% 0' : '0% 0', end = p.dir === 'ltr' ? '0% 0' : '100% 0';
      const ez = easeCSS(p.ease), ezOut = easeCSS(mirror(p.ease));
      let frames, active;
      if (p.mode === 'inout'){
        active = 2 * p.dur + p.hold;
        frames = [{offset: 0, backgroundPosition: start, easing: ez}, {offset: p.dur / active, backgroundPosition: end}, {offset: (p.dur + p.hold) / active, backgroundPosition: end, easing: ezOut}, {offset: 1, backgroundPosition: start}];
      } else {
        active = p.dur + p.hold;
        frames = lastPad([{offset: 0, backgroundPosition: start, easing: ez}, {offset: p.dur / active, backgroundPosition: end}]);
      }
      return {active, labelStyle: {...BG_CLIP(g), backgroundPosition: start}, tracks: [{target: 'label', frames}],
        rest: isHover(p) ? {label: {backgroundPosition: end}} : null};
    },
  },

  gradient: {
    name: 'Gradient flow', kind: 'label',
    desc: 'Colors drift continuously through the letters.',
    reduced: 'Animation off. The gradient stays still.',
    defaults: {c1: H, c2: SB, use3: true, c3: INK, spread: 250, trigger: 'loop', dir: 'left', dur: 4000, pause: 0, delay: 0, ease: E.linear},
    groups: [
      {title: 'Colors', controls: [
        {k: 'c1', t: 'color', label: 'First color'},
        {k: 'c2', t: 'color', label: 'Second color'},
        {k: 'use3', t: 'toggle', label: 'Add a third color'},
        {k: 'c3', t: 'color', label: 'Third color', show: p => p.use3},
      ]},
      {title: 'Spread', controls: [
        {k: 'spread', t: 'range', label: 'Spread', hint: 'Higher numbers stretch the colors so fewer show at once.', min: 125, max: 600, step: 5, unit: '%'},
      ]},
      timing({dir: [['left', 'Flow left'], ['right', 'Flow right']], durLabel: 'Cycle duration', durHint: 'Time for the colors to travel one full cycle.', durMax: 15000, easeHint: 'Linear keeps the flow even. Other curves make it surge.'}),
    ],
    compile(p){
      const cols = p.use3 ? [p.c1, p.c2, p.c3] : [p.c1, p.c2];
      const seq = [...cols, ...cols, cols[0]];
      const stops = seq.map((c, i) => `${c} ${(i / (seq.length - 1) * 100).toFixed(2)}%`).join(', ');
      const s = p.spread / 100, endPos = (s / (2 * (s - 1)) * 100).toFixed(2) + '% 0';
      const from = p.dir === 'left' ? '0% 0' : endPos, to = p.dir === 'left' ? endPos : '0% 0';
      return {active: p.dur, labelStyle: {...BG_CLIP(`linear-gradient(90deg, ${stops})`, `${p.spread}% 100%`, 'repeat'), backgroundPosition: from},
        tracks: [{target: 'label', frames: [{offset: 0, backgroundPosition: from, easing: easeCSS(p.ease)}, {offset: 1, backgroundPosition: to}]}]};
    },
  },

  glow: {
    name: 'Glow pulse', kind: 'label',

/* Shared by the preview and the exported script, so both behave the same. */
function scrambleAt(chars, t, o){
  var sets = {letters: 'abcdefghijklmnopqrstuvwxyz', upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', symbols: '!<>-_\\/[]{}=+*^?#%&', digits: '0123456789', binary: '01', blocks: '▖▗▘▙▚▛▜▝▞▟█▓▒░'};
  var set = sets[o.charset] || sets.upper, n = chars.length;
  var T = o.dur + (o.loop ? o.hold : 0) + (n - 1) * o.stagger + (o.loop ? o.pause : 0);
  var u = t - o.delay;
  if (o.loop && u >= 0) u = u % T;
  var k = Math.floor(Math.max(0, u) / o.rate);
  return chars.map(function(ch, i){
    if (ch.trim() === '') return {ch: ch, done: true};
    var start = o.start === 'wave' ? i * o.stagger : 0, end = o.dur + i * o.stagger;
    if (u >= end) return {ch: ch, done: true};
    if (u < start) return {ch: ch, hidden: true};
    var h = (Math.imul(i + 1, 2654435761) ^ Math.imul(k + 1, 40503)) >>> 0;
    return {ch: set[h % set.length], done: false};
  });
}

/* ================= build + mount ================= */
function fold(frames, active, T){
  const k = active / T;
  const out = frames.map(f => ({...f, offset: f.offset * k}));
  if (k < 0.99999){ const {easing, ...last} = out[out.length - 1]; out[out.length - 1] = {...last}; out.push({...last, offset: 1}); }
  return out;
}
function build(fx, p, text){
  const F = FX[fx];
  const chars = F.kind === 'char' ? Array.from(text || ' ') : null;
  const n = chars ? chars.length : 1;
  const r = F.compile(p, n);
  const loop = isLoop(p), s = chars ? (p.stagger || 0) : 0, spread = (n - 1) * s;
  const active = Math.max(1, r.active);
  const T = Math.max(1, loop ? active + spread + p.pause : active);
  const tracks = r.tracks.map(tr => ({...tr, frames: fold(tr.frames, active, T)}));
  const total = loop ? p.delay + T : p.delay + spread + active;
  return {fx, F, p, text, chars, n, s, T, active, spread, loop, iterations: loop ? Infinity : 1, total, delay: p.delay, ...r, tracks};
}
const liveJS = new Set();
function mount(host, fx, p, text, opt = {}){
  const pp = opt.forceLoop && !isLoop(p) ? {...p, trigger: 'loop', pause: Math.max(p.pause || 0, 1400)} : p;
  const C = build(fx, pp, text);
  host.textContent = '';
  const label = el('span', {class: 'tm-label'});
  applyStyle(label, C.labelStyle);
  const chars = [];
  if (C.chars){
    label.setAttribute('aria-label', text);
    C.chars.forEach((ch, i) => { const s = el('span', {class: 'ch', 'aria-hidden': 'true'}, ch); s.style.setProperty('--i', i); applyStyle(s, C.charStyle); label.append(s); chars.push(s); });
  } else label.textContent = text;
  let line = null;
  if (C.lineStyle){ line = el('span', {class: 'tm-line', 'aria-hidden': 'true'}); applyStyle(line, C.lineStyle); label.append(line); }
  host.append(label);
  const anims = [];
  C.tracks.forEach(tr => {
    const targets = tr.target === 'label' ? [[label, 0]] : tr.target === 'line' ? [[line, 0]]
      : chars.map((c, i) => [c, i]).filter(([, i]) => tr.which === 'last' ? i === chars.length - 1 : tr.which === 'notlast' ? i < chars.length - 1 : true);
    targets.forEach(([e, i]) => {
      const a = e.animate(tr.frames, {duration: C.T, delay: C.delay + (tr.target === 'char' ? i * C.s : 0), iterations: C.iterations, fill: 'both', easing: 'linear'});
      if (!opt.native) a.pause();
      anims.push(a);
    });
  });
  const ctrl = {C, label, host,
    setTime(t){
      if (C.F.js){
        if (t == null){ chars.forEach((s, i) => { s.textContent = C.chars[i]; s.style.visibility = ''; s.classList.remove('is-scrambling'); }); return; }
        const st = scrambleAt(C.chars, t, {...C.p, loop: C.loop});
        st.forEach((c, i) => { const s = chars[i]; s.textContent = c.hidden ? C.chars[i] : c.ch; s.style.visibility = c.hidden ? 'hidden' : ''; s.classList.toggle('is-scrambling', !c.done && !c.hidden); });
        return;
      }
      if (t == null){ anims.forEach(a => a.cancel()); return; }
      anims.forEach(a => { a.currentTime = t; });
    },
    destroy(){ anims.forEach(a => a.cancel()); liveJS.delete(ctrl); },
  };
  if (C.F.js && opt.native){ ctrl.start = performance.now(); liveJS.add(ctrl); }
  return ctrl;
}

    spec: {html: `<table class="spec">${sd.map(([t, rows]) => `<tr><th colspan="2">${esc(t)}</th></tr>` + rows.map(r => `<tr><td>${esc(r[0])}</td><td>${r[1]}</td></tr>`).join('')).join('')}</table>`,
      text: `${C.F.name} for "${C.text}"\n` + sd.map(([t, rows]) => `\n${t.toUpperCase()}\n` + rows.map(r => `- ${r[0]}: ${r[2]}`).join('\n')).join('\n')},
    css: {text: cssFor(C, cls)}, html: {text: htmlFor(C, cls)}, js: {text: jsFor(C, cls)}, json: {text: jsonFor(C)},
  };
  const ci = $('#clsName'); if (document.activeElement !== ci) ci.value = cls;
  const tabs = $('#tabs'); tabs.textContent = '';
  TABS.forEach(([k, l]) => { const b = el('button', {type: 'button', role: 'tab', 'aria-selected': String(S.tab === k)}, l); b.onclick = () => { S.tab = k; schedSave(); renderHandoff(); }; tabs.append(b); });
  const body = $('#hoBody'); body.textContent = '';
  const cur = HO[S.tab] || HO.spec;
  if (S.tab === 'spec') body.innerHTML = cur.html;
  else { const pre = el('pre', {class: 'code'}); pre.textContent = cur.text; body.append(pre); }
  $('#copyTab').textContent = `Copy ${TABS.find(t => t[0] === S.tab)[1]}`;
}
const schedHandoff = debounce(renderHandoff, 120);
function fullHandoffText(){
  return [HO.spec.text, '', '/* ---------- CSS ---------- */', HO.css.text, '', '<!-- ---------- HTML ---------- -->', HO.html.text, '', '// ---------- JS ----------', HO.js.text, '', `Live setup: ${shareURL()}`].join('\n');
}
$('#clsName').addEventListener('input', e => { S.cls[S.fx] = e.target.value; schedSave(); schedHandoff(); });
$('#clsName').addEventListener('blur', () => renderHandoff());

/* ================= copy + share ================= */
const toast = (() => { let t; return msg => { const e = $('#toast'); e.textContent = msg; e.classList.add('on'); clearTimeout(t); t = setTimeout(() => e.classList.remove('on'), 2600); }; })();
function copyText(text, done){
  const fallback = () => {
    const ta = el('textarea', {style: 'position:fixed;left:-9999px;top:0'}); ta.value = text; document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    ta.remove(); toast(ok ? done : 'Copy was blocked. Select the text and copy it by hand.');
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(done)).catch(fallback);
  else fallback();
}
function shareURL(){
  const b = btoa(unescape(encodeURIComponent(snapshot()))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return location.href.split('#')[0] + '#s=' + b;
}
$('#share').onclick = () => copyText(shareURL(), 'Link copied. It opens this exact setup.');
$('#copyTab').onclick = () => copyText(HO[S.tab].text, `${TABS.find(t => t[0] === S.tab)[1]} copied.`);
$('#copyAll').onclick = () => copyText(fullHandoffText(), 'Full handoff copied: spec, CSS, HTML, JS and a link.');
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#resetAll').onclick = () => { S.params[S.fx] = clone(FX[S.fx].defaults); pushHist(); fullRender(); toast(`${FX[S.fx].name} reset to defaults.`); };
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.type === 'text' || t.tagName === 'TEXTAREA')) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); }
  else if (e.key === ' ' && t === document.body){ e.preventDefault(); $('#play').click(); }
});
$('#labelText').addEventListener('input', e => { S.text = e.target.value; changed('text'); });

/* ================= change pipeline ================= */
const schedGallery = debounce(() => { renderGallery(); renderFxPick(); }, 350);
function changed(kind){
  updateControls();
  if (kind === 'stage') renderToolbar();
  rebuildStage();
  schedHandoff(); schedHist(); schedSave();
  if (kind === 'text' || kind === 'type') schedGallery(); else updateActiveCards();
}
function fullRender(){
  renderToolbar(); renderControls(); updateFxPick(); rebuildStage(); renderHandoff(); renderGallery(); schedSave();
}

/* ================= boot ================= */
wirePlayer();
renderFxPick();
fullRender();
pushHist();
if (location.hash.startsWith('#s=')) history.replaceState(null, '', location.pathname + location.search);
requestAnimationFrame(tick);
})();
</script>
</body>
